<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Follow-ups</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="apiClient.js"></script>
    <script src="settings.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="brand.service.js"></script>
    <script src="brandLoader.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f4f6f8;
            color: #333;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        input,
        select,
        textarea {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: #3498db;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-secondary {
            background: #7f8c8d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f1f3f5;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }

        .badge-pending {
            background: #f39c12;
        }

        .badge-completed {
            background: #27ae60;
        }

        .badge-cancelled {
            background: #e74c3c;
        }

        .badge-recurring {
            background: #3498db;
            margin-left: 5px;
            font-size: 10px;
        }

        .party-type-label {
            font-size: 11px;
            font-weight: normal;
            margin-left: 4px;
        }

        .party-type-customer {
            color: #007bff;
        }

        .party-type-supplier {
            color: #fd7e14;
        }

        body.dark-mode .party-type-customer {
            color: #58a6ff;
        }

        body.dark-mode .party-type-supplier {
            color: #f0883e;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 450px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
            line-height: 1;
        }

        .close-modal:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
        }

        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .controls,
        body.dark-mode table,
        body.dark-mode .modal-content {
            background: #2c2c2c;
            border-color: #444;
            color: #e0e0e0;
        }

        body.dark-mode th {
            background: #1f1f1f;
            border-color: #444;
        }

        body.dark-mode td {
            border-color: #444;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea {
            background: #3a3a3a;
            color: #fff;
            border-color: #555;
        }

        /* Action Dropdown Menu */
        .action-dropdown {
            position: relative;
            display: inline-block;
        }

        .action-btn-main {
            background-color: #607d8b;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .action-dropdown-content {
            display: none;
            position: fixed;
            background-color: #fff;
            min-width: 140px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 0;
            text-align: left;
        }

        .action-dropdown-content button {
            color: #333 !important;
            background: none !important;
            padding: 8px 16px !important;
            text-decoration: none !important;
            display: block !important;
            width: 100% !important;
            text-align: left !important;
            border: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            font-weight: normal !important;
            font-size: 13px !important;
        }

        .action-dropdown-content button:hover {
            background-color: #f1f1f1 !important;
            color: #000 !important;
        }

        .action-dropdown.active .action-dropdown-content {
            display: block;
        }

        body.dark-mode .action-dropdown-content {
            background-color: #2c2c2c;
            border-color: #444;
        }

        body.dark-mode .action-dropdown-content button {
            color: #e0e0e0 !important;
        }

        body.dark-mode .action-dropdown-content button:hover {
            background-color: #3a3a3a !important;
            color: #fff !important;
        }

        /* Sortable List Styles */
        #columnToggles {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        #columnToggles li {
            padding: 8px 12px;
            border: 1px solid #eee;
            margin-bottom: 5px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 4px;
        }

        body.dark-mode #columnToggles li {
            background: #333;
            border-color: #444;
        }

        /* Resizable Columns */
        #followUpTable th {
            position: relative;
        }

        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }

        .resizer:hover,
        .resizing {
            background-color: #3498db;
            opacity: 0.5;
        }

        /* Custom Tooltip Styles */
        .custom-tooltip {
            position: relative;
            display: inline-block;
        }
        .custom-tooltip .tooltip-text {
            visibility: hidden;
            width: 220px;
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 1001;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }
        .custom-tooltip .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #2c3e50 transparent transparent transparent;
        }
        .custom-tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        body.dark-mode .custom-tooltip .tooltip-text {
            background-color: #444;
            border: 1px solid #555;
            color: #e0e0e0;
        }
        body.dark-mode .custom-tooltip .tooltip-text::after {
            border-color: #444 transparent transparent transparent;
        }

        .row-due-today {
            background-color: #fff9c4 !important;
        }

        body.dark-mode .row-due-today {
            background-color: #554e05 !important;
        }

        .row-overdue {
            background-color: #ffe6e6 !important;
        }

        body.dark-mode .row-overdue {
            background-color: #4d1a1a !important;
        }
    </style>
</head>

<body>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="margin:0;"><i class="fas fa-headset"></i> Follow-ups - <span data-brand="name"></span></h2>
        <div style="display:flex; align-items:center; gap:10px;">
            <label style="cursor:pointer; display:flex; align-items:center; gap:5px; font-size:14px;">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()"> 🌙 Dark Mode
            </label>
            <button class="btn-danger" onclick="deleteSelected()" id="bulkDeleteBtn" style="display:none;"><i
                    class="fas fa-trash"></i> Delete Selected</button>
            <button class="btn-primary" onclick="openSettingsModal()" style="background:#607d8b;"><i
                    class="fas fa-cog"></i> Settings</button>
            <button class="btn-primary" onclick="fetchFollowUpsData()" style="background:#17a2b8;"><i
                    class="fas fa-sync-alt"></i> Refresh</button>
            <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> New Follow-up</button>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchBox" placeholder="Search party, notes..." style="width:200px;"
            oninput="renderTable()">
        <label>Party Type:</label>
        <select id="filterPartyType" onchange="renderTable()" style="width:120px;">
            <option value="">All</option>
            <option value="Customer">Customer</option>
            <option value="Supplier">Supplier</option>
        </select>
        <label>Status:</label>
        <select id="filterStatus" onchange="renderTable()" style="width:120px;">
            <option value="">All</option>
            <option value="Pending" selected>Pending</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
        </select>
        <label>From:</label>
        <input type="date" id="filterFromDate" onchange="renderTable()" style="width:130px;">
        <label>To:</label>
        <input type="date" id="filterToDate" onchange="renderTable()" style="width:130px;">
    </div>

    <div style="overflow-x:auto;">
        <table id="followUpTable">
            <thead>
                <tr id="followUpHeadRow"></tr>
            </thead>
            <tbody id="followUpBody"></tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->
    <div id="followUpModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #2c3e50;" id="modalTitle">New Follow-up</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <input type="hidden" id="fuId">

            <div class="form-group">
                <label>Party Type *</label>
                <select id="fuPartyType" onchange="populatePartyList()">
                    <option value="Customer">Customer</option>
                    <option value="Supplier">Supplier</option>
                </select>
            </div>

            <div class="form-group">
                <label>Party / Customer Name *</label>
                <input type="text" id="fuParty" placeholder="Enter name" list="partyList" onchange="autofillContact()">
                <datalist id="partyList"></datalist>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" id="fuContact" placeholder="Phone/Mobile">
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Follow-up Date *</label>
                    <input type="date" id="fuDate">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Follow-up Time (Optional)</label>
                    <input type="time" id="fuTime">
                </div>
            </div>
            <div class="form-group">
                <label>Notes / Reason</label>
                <textarea id="fuNotes" rows="3" placeholder="What needs to be discussed?"></textarea>
            </div>

            <div class="form-group" style="background:#f8f9fa; padding:10px; border-radius:6px; border:1px solid #eee;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:0;">
                    <input type="checkbox" id="fuRecurring" onchange="toggleRecurringOptions()"
                        style="width:auto; cursor:pointer;">
                    Automate Repetitive Follow-up
                </label>
                <div id="recurringOptions" style="display:none; margin-top:10px;">
                    <label>Repeat Frequency: 
                        <span class="custom-tooltip">
                            <i class="fas fa-info-circle" style="color: #3498db; cursor: help;"></i>
                            <span class="tooltip-text">When marked as 'Completed', a new pending follow-up will be auto-generated based on this frequency.</span>
                        </span>
                    </label>
                    <select id="fuFrequency" onchange="toggleCustomDays()">
                        <option value="Daily">Daily</option>
                        <option value="Weekly">Weekly</option>
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Half-Yearly">Half-Yearly</option>
                        <option value="Yearly">Yearly</option>
                        <option value="Custom">Custom Days</option>
                    </select>
                    <input type="number" id="fuRecurCount" placeholder="Stop after (times)" 
                           style="display:inline-block; width:140px; margin-left:10px;" min="1" title="Optional: Stop after X occurrences">
                    <input type="number" id="fuCustomDays" placeholder="Custom Days" 
                           style="display:none; width:110px; margin-left:10px;" min="1" title="Number of days to repeat">
                </div>
            </div>

            <!-- Dynamic Fields Container -->
            <div class="form-group" style="grid-column: span 2; display: flex; flex-wrap: wrap; gap: 15px;"
                id="dynamicFieldsContainer"></div>

            <div style="text-align: right; margin-top: 20px;">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-success" onclick="saveFollowUp()">Save Follow-up</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content" style="width: 400px; max-width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #2c3e50;">⚙️ Table Settings</h3>
                <span class="close-modal" onclick="closeSettingsModal()">&times;</span>
            </div>
            <p style="font-size:14px; color:#666; margin-bottom:10px;">Select and drag to reorder columns:</p>
            <ul id="columnToggles" style="margin-bottom: 15px;">
            </ul>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn-secondary" onclick="closeSettingsModal()">Close</button>
                <button class="btn-success" onclick="saveColumnSettings()">Apply</button>
            </div>
        </div>
    </div>

    <script>
        let followUps = JSON.parse(localStorage.getItem('follow_ups')) || [];
        let currentSortColumn = 'date';
        let currentSortDirection = 'asc';
        let columnVisibility = JSON.parse(localStorage.getItem('followUpColumnVis')) || {};

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("appThemeMode") === "dark") {
                document.body.classList.add("dark-mode");
                document.getElementById("darkModeToggle").checked = true;
            }
            populatePartyList();
            fetchFollowUpsData();

            // Check for URL parameter to open a specific follow-up
            const urlParams = new URLSearchParams(window.location.search);
            const followUpId = urlParams.get('id');
            if (followUpId) {
                openModal(followUpId);
            }

            // Auto-refresh data every 30 seconds to stay in sync
            setInterval(fetchFollowUpsData, 30000);
        });

        async function fetchFollowUpsData() {
            try {
                if (typeof apiClient !== 'undefined' && apiClient.getFollowUps) {
                    const remoteData = await apiClient.getFollowUps();
                    if (remoteData) {
                        followUps = remoteData;
                        localStorage.setItem('follow_ups', JSON.stringify(followUps));
                    }
                }
            } catch (e) {
                console.warn("API sync failed, using local data", e);
            }
            renderTable();
        }



        function toggleDarkMode() {
            const isDark = document.getElementById("darkModeToggle").checked;
            if (isDark) document.body.classList.add("dark-mode");
            else document.body.classList.remove("dark-mode");
            localStorage.setItem("appThemeMode", isDark ? "dark" : "light");
        }

        function populatePartyList() {
            const partyType = document.getElementById('fuPartyType').value;
            const data = JSON.parse(localStorage.getItem(partyType === 'Customer' ? 'customers' : 'suppliers')) || [];
            const list = document.getElementById('partyList');
            list.innerHTML = '';

            data.forEach(c => {
                if (c.name) {
                    const opt = document.createElement('option');
                    opt.value = c.name;
                    opt.dataset.contact = c.contact || '';
                    list.appendChild(opt);
                }
            });
        }

        function autofillContact() {
            const name = document.getElementById('fuParty').value;
            const list = document.getElementById('partyList');
            const option = Array.from(list.options).find(o => o.value === name);
            if (option && option.dataset.contact) {
                document.getElementById('fuContact').value = option.dataset.contact;
            }
        }

        function toggleRecurringOptions() {
            const isChecked = document.getElementById('fuRecurring').checked;
            document.getElementById('recurringOptions').style.display = isChecked ? 'block' : 'none';
        }
        
        function toggleCustomDays() {
            const freq = document.getElementById('fuFrequency').value;
            document.getElementById('fuCustomDays').style.display = freq === 'Custom' ? 'inline-block' : 'none';
        }

        let selectedIds = new Set();

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.selectRow').forEach(cb => {
                cb.checked = isChecked;
                if (isChecked) selectedIds.add(cb.value);
                else selectedIds.delete(cb.value);
            });
            updateBulkDeleteBtn();
        }

        function toggleRowSelection(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);

            const selectAllCb = document.getElementById('selectAll');
            const allRows = document.querySelectorAll('.selectRow');
            if (allRows.length > 0 && selectedIds.size === allRows.length) selectAllCb.checked = true;
            else selectAllCb.checked = false;

            updateBulkDeleteBtn();
        }

        function updateBulkDeleteBtn() {
            const btn = document.getElementById('bulkDeleteBtn');
            if (selectedIds.size > 0) {
                btn.style.display = 'inline-block';
                btn.innerHTML = `<i class="fas fa-trash"></i> Delete Selected (${selectedIds.size})`;
            } else btn.style.display = 'none';
        }

        function getAvailableColumns() {
            const standard = [
                { id: 'date', label: 'Date', isCustom: false },
                { id: 'partyName', label: 'Party Name', isCustom: false },
                { id: 'contact', label: 'Contact', isCustom: false },
                { id: 'notes', label: 'Notes / Reason', isCustom: false },
                { id: 'status', label: 'Status', isCustom: false }
            ];
            const allFields = JSON.parse(localStorage.getItem('CUSTOM_FIELDS')) || [];
            const customFields = allFields.filter(f => f.moduleName === 'Follow-up' && f.isActive).map(f => ({
                id: f.fieldName, label: f.fieldLabel, isCustom: true, fieldDef: f
            }));
            return [...standard, ...customFields];
        }

        function getOrderedColumns() {
            const available = getAvailableColumns();
            const savedOrder = JSON.parse(localStorage.getItem('followUpColumnOrder')) || [];

            available.sort((a, b) => {
                let idxA = savedOrder.indexOf(a.id);
                let idxB = savedOrder.indexOf(b.id);
                if (idxA === -1) idxA = 999;
                if (idxB === -1) idxB = 999;
                return idxA - idxB;
            });
            return available;
        }

        function openSettingsModal() {
            const container = document.getElementById('columnToggles');
            container.innerHTML = '';

            const cols = getOrderedColumns();

            if (cols.length === 0) {
                container.innerHTML = '<p style="color: #999; font-size: 13px; text-align: center;">No fields available.</p>';
            }

            cols.forEach(col => {
                let isChecked = columnVisibility[col.id];
                if (isChecked === undefined) isChecked = col.isCustom ? (col.fieldDef.showInGrid !== false) : true;


                const li = document.createElement('li');
                li.dataset.id = col.id;
                li.innerHTML = `
                    <i class="fas fa-grip-vertical" style="color: #aaa; cursor: grab;"></i>
                    <input type="checkbox" id="col_${col.id}" ${isChecked ? 'checked' : ''} style="width: auto; margin: 0; cursor: pointer;">
                    <label for="col_${col.id}" style="margin: 0; cursor: pointer; flex: 1; font-size: 13px;">${col.label}</label>
                `;
                container.appendChild(li);
            });

            if (typeof Sortable !== 'undefined') {
                new Sortable(container, {
                    animation: 150,
                    handle: '.fa-grip-vertical'
                });
            }

            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveColumnSettings() {
            const container = document.getElementById('columnToggles');
            const items = container.querySelectorAll('li');
            const newOrder = [];

            items.forEach(li => {
                const id = li.dataset.id;
                newOrder.push(id);
                const cb = li.querySelector(`input[type="checkbox"]`);
                if (cb) columnVisibility[id] = cb.checked;
            });

            localStorage.setItem('followUpColumnOrder', JSON.stringify(newOrder));
            localStorage.setItem('followUpColumnVis', JSON.stringify(columnVisibility));
            closeSettingsModal();
            renderTable();
        }

        function renderDynamicFields(existingData = {}) {
            const container = document.getElementById('dynamicFieldsContainer');
            if (!container) return;

            const allFields = JSON.parse(localStorage.getItem('CUSTOM_FIELDS')) || [];
            const moduleFields = allFields.filter(f => f.moduleName === 'Follow-up' && f.isActive);

            if (moduleFields.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            container.style.display = 'flex';
            container.innerHTML = '<div style="flex-basis: 100%; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px;">Additional Details</div>';

            moduleFields.sort((a, b) => a.order - b.order).forEach(field => {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = 'flex: 1; min-width: 150px; display: flex; flex-direction: column;';

                const label = document.createElement('label');
                label.innerText = field.fieldLabel + (field.isRequired ? ' *' : '');
                label.style.cssText = 'font-size: 12px; margin-bottom: 2px; color: #666; font-weight: bold;';

                let input;
                if (field.fieldType === 'select') {
                    input = document.createElement('select');
                    input.style.cssText = 'padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; width: 100%;';
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = ''; defaultOpt.innerText = 'Select...';
                    input.appendChild(defaultOpt);
                    (field.options || []).forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt; option.innerText = opt;
                        input.appendChild(option);
                    });
                } else if (field.fieldType === 'boolean') {
                    input = document.createElement('input');
                    input.type = 'checkbox';
                    input.style.cssText = 'width: auto; margin-right: 8px; cursor: pointer;';
                    wrapper.style.flexDirection = 'row';
                    wrapper.style.alignItems = 'center';
                } else {
                    input = document.createElement('input');
                    input.type = field.fieldType === 'number' ? 'number' : (field.fieldType === 'date' ? 'date' : 'text');
                    input.placeholder = field.fieldLabel;
                    input.style.cssText = 'padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; width: 100%; box-sizing: border-box;';
                }

                input.className = 'dynamic-field';
                input.dataset.fieldName = field.fieldName;
                if (field.isRequired) input.required = true;

                if (existingData[field.fieldName] !== undefined) {
                    if (field.fieldType === 'boolean') {
                        input.checked = existingData[field.fieldName] === true || existingData[field.fieldName] === 'true';
                    } else {
                        input.value = existingData[field.fieldName];
                    }
                }

                if (field.fieldType === 'boolean') {
                    wrapper.appendChild(input);
                    wrapper.appendChild(label);
                } else {
                    wrapper.appendChild(label);
                    wrapper.appendChild(input);
                }

                container.appendChild(wrapper);
            });
        }

        function duplicateFollowUp(id) {
            const f = followUps.find(x => x.id === id);
            if (!f) return;

            document.getElementById('modalTitle').innerText = "Duplicate Follow-up";
            document.getElementById('fuId').value = '';
            document.getElementById('fuPartyType').value = f.partyType || 'Customer';
            populatePartyList();
            document.getElementById('fuParty').value = f.partyName;
            document.getElementById('fuContact').value = f.contact || '';
            document.getElementById('fuDate').value = f.date;
            document.getElementById('fuTime').value = f.time || '';
            document.getElementById('fuNotes').value = f.notes || '';
            document.getElementById('fuRecurring').checked = f.isRecurring || false;
            document.getElementById('fuFrequency').value = f.frequency || 'Weekly';
            document.getElementById('fuRecurCount').value = f.recurCount || '';
            document.getElementById('fuCustomDays').value = f.customDays || '';

            toggleRecurringOptions();
            toggleCustomDays();
            renderDynamicFields(f);
            document.getElementById('followUpModal').style.display = 'flex';
        }

        function openModal(id = null) {
            document.getElementById('modalTitle').innerText = id ? "Edit Follow-up" : "New Follow-up";
            if (id) {
                const f = followUps.find(x => x.id === id);
                document.getElementById('fuId').value = f.id;
                document.getElementById('fuPartyType').value = f.partyType || 'Customer';
                populatePartyList();
                document.getElementById('fuParty').value = f.partyName;
                document.getElementById('fuContact').value = f.contact || '';
                document.getElementById('fuDate').value = f.date;
                document.getElementById('fuTime').value = f.time || '';
                document.getElementById('fuNotes').value = f.notes || '';
                document.getElementById('fuRecurring').checked = f.isRecurring || false;
                document.getElementById('fuFrequency').value = f.frequency || 'Weekly';
            document.getElementById('fuRecurCount').value = f.recurCount || '';
                document.getElementById('fuCustomDays').value = f.customDays || '';
                renderDynamicFields(f);
            } else {
                document.getElementById('fuId').value = '';
                document.getElementById('fuPartyType').value = 'Customer';
                populatePartyList();
                document.getElementById('fuParty').value = '';
                document.getElementById('fuContact').value = '';
                document.getElementById('fuDate').valueAsDate = new Date();
                document.getElementById('fuTime').value = '';
                document.getElementById('fuNotes').value = '';
                document.getElementById('fuRecurring').checked = false;
                document.getElementById('fuFrequency').value = 'Weekly';
            document.getElementById('fuRecurCount').value = '';
                document.getElementById('fuCustomDays').value = '';
                renderDynamicFields({});
            }
            toggleRecurringOptions();
            toggleCustomDays();
            document.getElementById('followUpModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('followUpModal').style.display = 'none';
        }

        function saveFollowUp() {
            const id = document.getElementById('fuId').value;
            const partyName = document.getElementById('fuParty').value.trim();
            const partyType = document.getElementById('fuPartyType').value;
            const contact = document.getElementById('fuContact').value.trim();
            const date = document.getElementById('fuDate').value;
            const time = document.getElementById('fuTime').value;
            const notes = document.getElementById('fuNotes').value.trim();
            const isRecurring = document.getElementById('fuRecurring').checked;
            const frequency = document.getElementById('fuFrequency').value;
        const recurCount = document.getElementById('fuRecurCount').value;
        const customDays = document.getElementById('fuCustomDays').value;

            if (!partyName || !date) return alert("Party Name and Date are required!");

            const payload = {
                id: id || 'fu_' + Date.now(),
                partyName, partyType, contact, date, time, notes, isRecurring, frequency,
            recurCount: recurCount ? parseInt(recurCount) : null,
            customDays: customDays ? parseInt(customDays) : null,
                status: id ? followUps.find(f => f.id === id).status : 'Pending',
                createdAt: new Date().toISOString()
            };

            // Attach Dynamic Fields
            document.querySelectorAll('.dynamic-field').forEach(input => {
                if (input.type === 'checkbox') {
                    payload[input.dataset.fieldName] = input.checked;
                } else {
                    payload[input.dataset.fieldName] = input.value;
                }
            });

            if (id) {
                const idx = followUps.findIndex(f => f.id === id);
                followUps[idx] = payload;
            } else {
                followUps.push(payload);
            }

            localStorage.setItem('follow_ups', JSON.stringify(followUps));
            if (typeof apiClient !== 'undefined' && apiClient.saveFollowUp) apiClient.saveFollowUp(payload).catch(console.warn);
            closeModal();
            renderTable();
        }

        function calculateNextDate(currentDateStr, frequency, customDays) {
            if (!currentDateStr) return new Date();
            const parts = currentDateStr.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            if (isNaN(date.getTime())) return new Date();

            if (frequency === 'Daily') {
                date.setDate(date.getDate() + 1);
            } else if (frequency === 'Weekly') {
                date.setDate(date.getDate() + 7);
            } else if (frequency === 'Monthly') {
                date.setMonth(date.getMonth() + 1);
            } else if (frequency === 'Quarterly') {
                date.setMonth(date.getMonth() + 3);
            } else if (frequency === 'Half-Yearly') {
                date.setMonth(date.getMonth() + 6);
            } else if (frequency === 'Yearly') {
                date.setFullYear(date.getFullYear() + 1);
            } else if (frequency === 'Custom' && customDays) {
                date.setDate(date.getDate() + parseInt(customDays));
            }
            return date;
        }

        async function markStatus(id, newStatus) {
    const itemIndex = followUps.findIndex(f => f.id === id);
    if (itemIndex === -1) return;

    let item = followUps[itemIndex];
    item.status = newStatus;
    item.completedAt = newStatus === 'Completed' ? new Date().toISOString() : null;

    let newlyCreatedId = null;

    // Recurring follow-up logic
    if (newStatus === 'Completed' && item.isRecurring && item.frequency) {
        let shouldCreateNew = true;
        let nextRecurCount = item.recurCount;

        if (item.recurCount !== undefined && item.recurCount !== null && item.recurCount !== '') {
            const currentCount = parseInt(item.recurCount);
            if (currentCount <= 1) {
                shouldCreateNew = false;
            } else {
                nextRecurCount = currentCount - 1;
            }
        }

        if (shouldCreateNew) {
            const newDate = calculateNextDate(item.date, item.frequency, item.customDays);
            const year = newDate.getFullYear();
            const month = String(newDate.getMonth() + 1).padStart(2, '0');
            const day = String(newDate.getDate()).padStart(2, '0');
            const formattedDate = `${year}-${month}-${day}`;

            const newFollowUp = {
                ...item,
                id: 'fu_' + Date.now(),
                date: formattedDate,
                status: 'Pending',
                completedAt: null,
                createdAt: new Date().toISOString(),
                recurCount: nextRecurCount
            };
            newlyCreatedId = newFollowUp.id;
            delete newFollowUp.isNew; // Clean up any temporary flags
            followUps.push(newFollowUp);
            
            // Adjust the 'To' date filter if the new follow-up is outside the current range
            const toDateFilter = document.getElementById('filterToDate');
            if (toDateFilter && toDateFilter.value && newFollowUp.date > toDateFilter.value) {
                toDateFilter.value = newFollowUp.date;
                // Assuming a showToast function exists from other parts of the app
                if (typeof showToast === 'function') {
                    showToast(`'To' date filter updated to show the new task.`, '#3498db');
                }
            }

            const statusFilter = document.getElementById('filterStatus');
            if (statusFilter && statusFilter.value === 'Completed') {
                statusFilter.value = ''; // Reset to 'All' to ensure the new Pending task is visible
            }

            alert(`Automated Next Action: A new pending follow-up has been scheduled for ${newFollowUp.date}`);
        }
    }

    localStorage.setItem("follow_ups", JSON.stringify(followUps));
    if (typeof apiClient !== 'undefined') {
        await apiClient.saveFollowUp(item);
    }
    renderTable();

    // Highlight the newly created row if it is currently visible in the table
    if (newlyCreatedId) {
        setTimeout(() => {
            const newRow = document.getElementById('row-' + newlyCreatedId);
            if (newRow) {
                const isDark = document.body.classList.contains('dark-mode');
                newRow.style.transition = 'none'; // Instant highlight
                newRow.style.backgroundColor = isDark ? '#1e4620' : '#d4edda';
                
                setTimeout(() => {
                    newRow.style.transition = 'background-color 1s ease';
                    newRow.style.backgroundColor = '';
                }, 4000); // Wait 4 seconds, fade out over 1 second (total 5s)
            }
        }, 100);
    }
}
        

        function deleteFollowUp(id) {
            if (!confirm("Are you sure you want to delete this follow-up?")) return;
            followUps = followUps.filter(f => f.id !== id);
            localStorage.setItem('follow_ups', JSON.stringify(followUps));
            if (typeof apiClient !== 'undefined' && apiClient.deleteFollowUp) apiClient.deleteFollowUp(id).catch(console.warn);
            renderTable();
        }

        function deleteSelected() {
            if (selectedIds.size === 0) return;
            if (!confirm(`Are you sure you want to delete ${selectedIds.size} selected follow-up(s)?`)) return;

            if (typeof apiClient !== 'undefined' && apiClient.deleteFollowUp) {
                selectedIds.forEach(id => apiClient.deleteFollowUp(id).catch(console.warn));
            }



            followUps = followUps.filter(f => !selectedIds.has(f.id));
            localStorage.setItem('follow_ups', JSON.stringify(followUps));
            selectedIds.clear();
            document.getElementById('selectAll').checked = false;
            updateBulkDeleteBtn();
            renderTable();
        }

        function openWhatsApp(contact, notes) {
            if (!contact) return alert("No contact number found.");
            const cleanNo = contact.replace(/\D/g, '');
            const msg = encodeURIComponent(`Hello,\nFollowing up regarding: ${notes}`);
            window.open(`https://wa.me/91${cleanNo}?text=${msg}`, '_blank');
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const [h, m] = timeStr.split(':');
            const hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const formattedH = hours % 12 || 12;
            return `${formattedH}:${m} ${ampm}`;
        }

        function handleSort(column) {
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('followUpBody');
            tbody.innerHTML = '';

            const orderedCols = getOrderedColumns().filter(c => {
                let isVisible = columnVisibility[c.id];
                if (isVisible === undefined) isVisible = c.isCustom ? (c.fieldDef.showInGrid !== false) : true;
                return isVisible;
            });

            const theadTr = document.getElementById('followUpHeadRow');
            let thHtml = `<th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>`;

            orderedCols.forEach(c => {
                let widthStyle = '';
                let extraStyle = '';
                if (c.id === 'date') widthStyle = 'width: 100px;';
                if (c.id === 'contact') widthStyle = 'width: 120px;';
                if (c.id === 'status') { widthStyle = 'width: 140px;'; extraStyle = 'text-align: center;'; }

                thHtml += `<th style="${widthStyle} ${extraStyle} cursor: pointer;" onclick="handleSort('${c.id}')">${c.label} <span id="sort-icon-${c.id}" style="font-size: 11px;"></span></th>`;
            });
            thHtml += `<th style="width: 150px; text-align: center;">Actions</th>`;
            theadTr.innerHTML = thHtml;

            const search = document.getElementById('searchBox').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;
            const filterPartyType = document.getElementById('filterPartyType') ? document.getElementById('filterPartyType').value : '';
            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;

            let filtered = followUps.filter(f => {
                const matchSearch = (f.partyName || '').toLowerCase().includes(search) || (f.notes || '').toLowerCase().includes(search);
                const matchStatus = filterStatus ? f.status === filterStatus : true;
                const matchPartyType = filterPartyType ? (f.partyType || 'Customer') === filterPartyType : true;
                const matchDate = (!fromDate || f.date >= fromDate) && (!toDate || f.date <= toDate);
                return matchSearch && matchStatus && matchDate && matchPartyType;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSortColumn] || '';
                let valB = b[currentSortColumn] || '';

                if (currentSortColumn === 'date') {
                    const dateA = new Date((a.date || '1970-01-01') + 'T' + (a.time || '00:00')).getTime();
                    const dateB = new Date((b.date || '1970-01-01') + 'T' + (b.time || '00:00')).getTime();
                    return currentSortDirection === 'asc' ? dateA - dateB : dateB - dateA;
                } else {
                    valA = valA.toString().toLowerCase();
                    valB = valB.toString().toLowerCase();
                    if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                    return 0;
                }
            });

            const sortColumns = orderedCols.map(c => c.id);
            sortColumns.forEach(col => {
                const icon = document.getElementById(`sort-icon-${col}`);
                if (icon) icon.innerHTML = (currentSortColumn === col) ? (currentSortDirection === 'asc' ? ' ▲' : ' ▼') : '';
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${2 + orderedCols.length}" style="text-align:center; padding:20px; color:#666;">No follow-ups found.</td></tr>`;
                requestAnimationFrame(() => {
                    loadColumnWidths();
                    enableColumnResizing();
                });
                return;
            }

            const todayDate = new Date();
            const todayStr = `${todayDate.getFullYear()}-${String(todayDate.getMonth() + 1).padStart(2, '0')}-${String(todayDate.getDate()).padStart(2, '0')}`;

            filtered.forEach(f => {
                const tr = document.createElement('tr');
            tr.id = 'row-' + f.id;

            if (f.status === 'Pending') {
                if (f.date === todayStr) {
                    tr.classList.add('row-due-today');
                } else if (f.date < todayStr) {
                    tr.classList.add('row-overdue');
                }
            }

                let statusBadge = '';
                if (f.status === 'Pending') statusBadge = `<span class="badge badge-pending">Pending</span>`;
                else if (f.status === 'Completed') statusBadge = `<span class="badge badge-completed">Completed</span>`;
                else if (f.status === 'Cancelled') statusBadge = `<span class="badge badge-cancelled">Cancelled</span>`;

                let recurringBadge = f.isRecurring ? `<span class="badge badge-recurring" title="Repeats ${f.frequency}"><i class="fas fa-sync-alt"></i></span>` : '';

                const pType = f.partyType || 'Customer';
                const pClass = pType === 'Customer' ? 'party-type-customer' : 'party-type-supplier';
                const isChecked = selectedIds.has(f.id) ? 'checked' : '';

                let actionsHtml = `
                    <div class="action-dropdown" id="actionDropdown-${f.id}">
                        <button class="action-btn-main" onclick="toggleActionMenu(this)">Actions ▼</button>
                        <div class="action-dropdown-content">
                `;
                if (f.status === 'Pending') {
                    actionsHtml += `<button onclick="markStatus('${f.id}', 'Completed')">✅ Mark Completed</button>`;
                    actionsHtml += `<button onclick="markStatus('${f.id}', 'Cancelled')">❌ Cancel</button>`;
                }
                actionsHtml += `<button onclick="openModal('${f.id}')">✏️ Edit</button>`;
                actionsHtml += `<button onclick="duplicateFollowUp('${f.id}')">📋 Duplicate</button>`;
                if (f.contact) {
                    actionsHtml += `<button onclick="openWhatsApp('${f.contact}', '${(f.notes || '').replace(/'/g, "\\'")}')" style="color:#25D366 !important;">📱 WhatsApp</button>`;
                }
                actionsHtml += `<button onclick="deleteFollowUp('${f.id}')" style="color: #dc3545 !important;">🗑️ Delete</button>
                        </div>
                    </div>`;

                let contactHtml = '-';
                if (f.contact) {
                    const cleanNo = f.contact.replace(/\D/g, '');
                    const callLink = cleanNo ? `<a href="tel:${cleanNo}" style="color:#0d6efd; text-decoration:none; margin-right:6px;" title="Call"><i class="fas fa-phone-alt"></i></a>` : '';
                    const waLink = cleanNo ? `<a href="javascript:void(0)" onclick="openWhatsApp('${f.contact}', '${(f.notes || '').replace(/'/g, "\\'")}')" style="color:#25D366; text-decoration:none; margin-left:6px;" title="Message on WhatsApp"><i class="fab fa-whatsapp"></i></a>` : '';
                    contactHtml = `<div style="white-space:nowrap; display:flex; align-items:center;">${callLink}<span>${f.contact}</span>${waLink}</div>`;
                }

                let trHtml = `<td style="text-align: center;"><input type="checkbox" class="selectRow" value="${f.id}" ${isChecked} onchange="toggleRowSelection('${f.id}')"></td>`;

                orderedCols.forEach(c => {
                    if (!c.isCustom) {
                        if (c.id === 'date') {
                            trHtml += `<td>${new Date(f.date).toLocaleDateString('en-GB')}${f.time ? `<br><small style="color:#555;">${formatTime(f.time)}</small>` : ''}</td>`;
                        } else if (c.id === 'partyName') {
                            trHtml += `<td style="font-weight:600; color:#2c3e50;">${f.partyName} <span class="party-type-label ${pClass}">(${pType})</span> ${recurringBadge}</td>`;
                        } else if (c.id === 'contact') {
                            trHtml += `<td>${contactHtml}</td>`;
                        } else if (c.id === 'notes') {
                            trHtml += `<td>${f.notes || '-'}</td>`;
                        } else if (c.id === 'status') {
                            trHtml += `<td style="text-align:center;">${statusBadge}</td>`;
                        }
                    } else {
                        let val = f[c.id];
                        const cf = c.fieldDef;
                        if (val === undefined || val === null || val === '') {
                            val = '-';
                        } else if (cf.fieldType === 'boolean') {
                            val = (val === true || val === 'true') ? 'Yes' : 'No';
                        } else if (cf.fieldType === 'date') {
                            const d = new Date(val);
                            if (!isNaN(d.getTime())) val = d.toLocaleDateString('en-GB');
                        } else if (cf.fieldType === 'currency' || cf.fieldType === 'number') {
                            let num = parseFloat(val);
                            if (!isNaN(num)) {
                                val = num.toLocaleString('en-IN', { minimumFractionDigits: cf.currencyDecimals ?? 2, maximumFractionDigits: cf.currencyDecimals ?? 2 });
                                if (cf.prefix || cf.currencySymbol) val = (cf.prefix || cf.currencySymbol) + ' ' + val;
                                if (cf.suffix) val = val + ' ' + cf.suffix;
                            }
                        }
                        trHtml += `<td>${val}</td>`;
                    }
                });

                trHtml += `<td style="text-align:center; white-space:nowrap;">${actionsHtml}</td>`;
                tr.innerHTML = trHtml;
                tbody.appendChild(tr);
            });

            requestAnimationFrame(() => {
                loadColumnWidths();
                enableColumnResizing();
            });
        }

        function toggleActionMenu(btn) {
            document.querySelectorAll('.action-dropdown.active').forEach(d => {
                if (d !== btn.parentElement) d.classList.remove('active');
            });
            const dropdown = btn.parentElement;
            dropdown.classList.toggle('active');
            if (dropdown.classList.contains('active')) {
                const content = dropdown.querySelector('.action-dropdown-content');
                content.style.display = 'block';
                const rect = btn.getBoundingClientRect();
                let top = rect.bottom;
                let left = rect.right - content.offsetWidth;
                if (top + content.offsetHeight > window.innerHeight) { top = rect.top - content.offsetHeight; }
                content.style.top = top + 'px';
                content.style.left = left + 'px';
                content.style.display = '';
            }
        }
        document.addEventListener('click', function (e) { if (!e.target.matches('.action-btn-main')) { document.querySelectorAll('.action-dropdown.active').forEach(d => d.classList.remove('active')); } });
        window.addEventListener('scroll', function () { document.querySelectorAll('.action-dropdown.active').forEach(d => d.classList.remove('active')); }, true);


        function enableColumnResizing() {
            const table = document.getElementById('followUpTable');
            if (!table) return;
            const headers = table.querySelectorAll('th');

            headers.forEach((th) => {
                if (th.querySelector('.resizer')) return;

                const resizer = document.createElement('div');
                resizer.classList.add('resizer');
                th.appendChild(resizer);

                resizer.addEventListener('click', function (e) {
                    e.stopPropagation();
                });

                let startX, startWidth;
                resizer.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    startX = e.pageX;
                    startWidth = th.offsetWidth;
                    resizer.classList.add('resizing');

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                function onMouseMove(e) {
                    const newWidth = startWidth + (e.pageX - startX);
                    if (newWidth > 30) {
                        th.style.width = newWidth + 'px';
                        th.style.minWidth = newWidth + 'px';
                    }
                }

                function onMouseUp() {
                    resizer.classList.remove('resizing');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    saveColumnWidths();
                }
            });
        }

        function saveColumnWidths() {
            const widths = [];
            const headers = document.querySelectorAll('#followUpTable th');
            headers.forEach(th => {
                widths.push(th.style.width);
            });
            localStorage.setItem('followUpColumnWidths', JSON.stringify(widths));
        }

        function loadColumnWidths() {
            const savedWidths = JSON.parse(localStorage.getItem('followUpColumnWidths'));
            if (savedWidths && Array.isArray(savedWidths)) {
                const headers = document.querySelectorAll('#followUpTable th');
                headers.forEach((th, index) => {
                    if (savedWidths[index]) {
                        th.style.width = savedWidths[index];
                        th.style.minWidth = savedWidths[index];
                    }
                });
            }
        }
    </script>
