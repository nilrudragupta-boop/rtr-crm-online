<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RISE Tech CRM V2 Phase 3</title>
    <link rel="stylesheet" href="css/lightning-system.css">
    <style>
        body {
            margin: 0;
            background: #f3f6f9;
            font-family: Arial;
            color: #172b4d
        }

        .wrap {
            padding: 18px
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .title h1 {
            margin: 0
        }

        .muted {
            color: #667085;
            font-size: 12px
        }

        .global-search {
            position: relative;
            flex: 1 1 360px;
            max-width: 520px
        }

        .global-search input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8dde6;
            border-radius: 6px;
            font-size: 13px
        }

        .global-results {
            display: none;
            position: absolute;
            z-index: 20;
            top: 42px;
            left: 0;
            right: 0;
            max-height: 280px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #d8dde6;
            border-radius: 6px;
            box-shadow: 0 5px 16px #172b4d22
        }

        .global-result {
            display: block;
            width: 100%;
            padding: 9px 12px;
            border: 0;
            border-bottom: 1px solid #edf0f3;
            background: #fff;
            text-align: left;
            cursor: pointer
        }

        .global-result:hover {
            background: #f3f6f9
        }

        .btn {
            border: 1px solid #d8dde6;
            background: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700
        }

        .primary {
            background: #0176d3;
            color: #fff;
            border-color: #0176d3
        }

        .tabs {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 15px 0
        }

        .tab {
            padding: 9px 12px;
            border: 1px solid #d8dde6;
            background: #fff;
            border-radius: 20px;
            cursor: pointer
        }

        .tab.active {
            background: #0176d3;
            color: #fff
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px
        }

        .card {
            background: #fff;
            border: 1px solid #d8dde6;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px
        }

        .k {
            font-size: 11px;
            text-transform: uppercase;
            color: #667085;
            font-weight: 700
        }

        .v {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        .table th,
        .table td {
            padding: 8px;
            border-bottom: 1px solid #edf0f3;
            text-align: left
        }

        .bar {
            height: 10px;
            background: #edf0f3;
            border-radius: 20px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: #0176d3
        }

        .score {
            font-size: 34px;
            font-weight: 800
        }

        .pill {
            padding: 3px 7px;
            border-radius: 15px;
            background: #eef4fa;
            font-size: 10px;
            font-weight: 700
        }

        .searchrow {
            display: flex;
            gap: 8px
        }

        .searchrow input,
        .searchrow select {
            padding: 10px;
            border: 1px solid #d8dde6;
            border-radius: 6px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        @media(max-width:800px) {
            .two {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div>
                <h1>RISE Tech CRM V2 · Phase 3</h1>
                <div class="muted">360° Intelligence · Sales Pipeline · Receivable Ageing · Profitability · Approvals ·
                    Access Control</div>
            </div>
            <div class="global-search"><input id="phase3Search"
                    placeholder="Find a customer, supplier, enquiry, quote or invoice..." autocomplete="off">
                <div id="phase3SearchResults" class="global-results"></div>
            </div>
            <div><button class="btn" onclick="location.href='crm_v2.html'">V2 Home</button></div>
        </div>
        <div class="tabs"><button class="tab active" data-tab="dashboard">Overview</button><button class="tab"
                data-tab="pipeline">Sales</button><button class="tab" data-tab="ageing">Payments</button><button
                class="tab" data-tab="profit">Margin</button><button class="tab"
                data-tab="approvals">Approvals</button><button class="tab" data-tab="360">Customer View</button><button
                class="tab" data-tab="roles">Team Access</button></div>
        <div id="app"></div>
    </div>
    <script src="apiClient.js"></script>
    <script src="crm_v2_phase3.js"></script>
</body>

</html>
