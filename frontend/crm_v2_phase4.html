<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>RISE Tech CRM V2 · Phase 4</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #fff;
            --ink: #172033;
            --muted: #667085;
            --line: #e4e7ec;
            --accent: #175cd3;
            --good: #067647;
            --warn: #b54708;
            --bad: #b42318
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px Arial, sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        a {
            color: var(--accent);
            text-decoration: none
        }

        a:hover {
            text-decoration: underline
        }

        .wrap {
            max-width: 1450px;
            margin: auto;
            padding: 22px
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 18px
        }

        .muted {
            color: var(--muted)
        }

        h1 {
            margin: 0 0 6px;
            font-size: 25px
        }

        .btn {
            border: 1px solid var(--line);
            background: #fff;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 2px #0000000a
        }

        .card tbody tr:hover {
            background: #f8fafc
        }

        .k {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase
        }

        .v {
            font-size: 25px;
            font-weight: 700;
            margin-top: 7px
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0
        }

        .tab {
            padding: 9px 13px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            cursor: pointer
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .two {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 14px
        }

        .table {
            width: 100%;
            border-collapse: collapse
        }

        .table th,
        .table td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top
        }

        .pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 99px;
            background: #eef2f6
        }

        .good {
            color: var(--good)
        }

        .warn {
            color: var(--warn)
        }

        .bad {
            color: var(--bad)
        }

        .rule {
            display: grid;
            grid-template-columns: 1.5fr 1fr .7fr .7fr auto;
            gap: 10px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line)
        }

        .switch {
            cursor: pointer
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: var(--muted)
        }

        @media(max-width:900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .two {
                grid-template-columns: 1fr
            }

            .rule {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div>
                <h1>RISE Tech CRM V2 · Phase 4</h1>
                <div class="muted">Workflow Automation · SLA Monitoring · Task Generation · Notification Centre</div>
            </div>
            <div><button class="btn" onclick="location.href='crm_v2.html'">V2 Home</button> <button class="btn primary"
                    id="run">▶ Run Automation</button></div>
        </div>
        <div class="tabs"><button class="tab active" data-tab="dashboard">Overview</button><button class="tab"
                data-tab="notifications">Action List</button><button class="tab" data-tab="sla">Service
                Watch</button><button class="tab" data-tab="rules">Smart Rules</button><button class="tab"
                data-tab="runs">Daily Log</button></div>
        <div id="app"></div>
    </div>
    <script src="crm_v2_phase4.js"></script>
</body>

</html>
