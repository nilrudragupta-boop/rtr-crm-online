<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Entry & Exit</title>
    <!-- Assuming you use standard Bootstrap in your project -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-exchange-alt"></i> Quick Stock Entry & Exit</h4>
            </div>
            <div class="card-body">
                <form id="stockJournalForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Select Item *</label>
                            <input type="text" id="sj-item-search" class="form-control" list="sj-item-list" placeholder="Search Item..." required autocomplete="off">
                            <datalist id="sj-item-list"></datalist>
                            <input type="hidden" id="sj-item">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Transaction Date *</label>
                            <input type="date" id="sj-date" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3" id="itemDetailsRow" style="display:none; background:#e9ecef; padding:10px; border-radius:5px; margin-left: 0; margin-right: 0;">
                        <div class="col-md-3" style="font-size:13px;"><strong>Item Code:</strong> <span id="lbl-itemCode" class="text-primary">-</span></div>
                        <div class="col-md-3" style="font-size:13px;"><strong>Index No:</strong> <span id="lbl-indexNo" class="text-primary">-</span></div>
                        <div class="col-md-3" style="font-size:13px;"><strong>Category:</strong> <span id="lbl-category" class="text-primary">-</span></div>
                        <div class="col-md-3" style="font-size:13px;"><strong>UOM:</strong> <span id="lbl-uom" class="text-primary">-</span></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Transaction Type *</label>
                            <select id="sj-type" class="form-select" required>
                                <option value="IN">Stock IN (Entry)</option>
                                <option value="OUT">Stock OUT (Exit)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            <input type="number" id="sj-qty" class="form-control" min="0.01" step="0.01" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Remarks / Reference</label>
                            <input type="text" id="sj-remarks" class="form-control" placeholder="e.g. Adjusted, Damaged, Received">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-secondary me-2" onclick="window.history.back()">Cancel</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Integration Scripts -->
    <script src="apiClient.js"></script>
    <script src="stock_journal.js"></script>
</body>
</html>
