<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rise B2B Industrial CRM</title>
  <link rel="stylesheet" href="css/lightning-system.css">
</head>
<body>
  <div class="slds-shell">
    <!-- Global Header -->
    <header class="slds-topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="sidebarToggle" class="slds-btn" style="border: none; padding: 4px 8px; font-size: 16px;">☰</button>
        <strong style="font-size: 16px; color: var(--slds-brand); letter-spacing: 0.5px;">RISE CRM</strong>
        <span class="slds-badge slds-badge-info">Thermal & Industrial</span>
      </div>

      <div class="slds-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Search Customers, Plants, Enquiries, QT, Invoices..." autocomplete="off">
        <div id="globalSearchResults" class="slds-search-results"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="slds-btn" onclick="CRM.openQuickActionModal()">⚡ Quick Action</button>
        <span>🔔</span>
        <span>⚙️</span>
        <div style="display: flex; align-items: center; gap: 6px; font-weight: 600;">
          <span>👤 Sales Eng.</span>
        </div>
      </div>
    </header>

    <div class="slds-body-wrapper">
      <!-- Persistent Salesforce-Style Navigation -->
      <nav class="slds-sidebar" id="appSidebar">
        <ul class="slds-nav-list">
          <li><a class="slds-nav-item active" onclick="CRM.navigate('dashboard')"><span class="icon">🏠</span><span class="label">Home</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('customer360')"><span class="icon">👥</span><span class="label">Customer 360°</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('plants')"><span class="icon">🏭</span><span class="label">Plants & Equipment</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('enquiries')"><span class="icon">📩</span><span class="label">Enquiries (Kanban)</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('quotations')"><span class="icon">💰</span><span class="label">Quotations</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('negotiations')"><span class="icon">🤝</span><span class="label">Negotiations</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('direct_sale')"><span class="icon">⚡</span><span class="label">Direct Sale</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('invoices')"><span class="icon">🧾</span><span class="label">Invoices & Ageing</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('tickets')"><span class="icon">🛠</span><span class="label">Service & Tickets</span></a></li>
          <li><a class="slds-nav-item" onclick="CRM.navigate('reports')"><span class="icon">📊</span><span class="label">Reports</span></a></li>
        </ul>
      </nav>

      <!-- Main Workspace -->
      <main class="slds-workspace" id="mainWorkspace">
        <div class="slds-page-header" id="workspaceHeader">
          <div>
            <div id="breadcrumbBar" style="font-size: 11px; color: var(--slds-text-muted); margin-bottom: 2px;">CRM Home</div>
            <h1 id="pageTitle">Industrial Dashboard</h1>
          </div>
          <div id="pageActions" style="display: flex; gap: 8px;"></div>
        </div>

        <div class="slds-content-area" id="workspaceContent">
          <!-- Dynamic Module Injection Viewport -->
        </div>
      </main>
    </div>
  </div>

  <div id="toastContainer" class="slds-toast-container"></div>

  <!-- Core Scripts -->
  <script src="apiClient.js"></script>
  <script src="crm_relational_engine.js"></script>
  <script src="lightning_app.js"></script>
</body>
</html>
