<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatter - RTR CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; background: white; margin: 0; }
        .message-box { margin-bottom: 15px; max-width: 75%; clear: both; }
        .message-me { float: right; text-align: right; }
        .message-other { float: left; text-align: left; }
        .message-content { padding: 10px 15px; border-radius: 15px; display: inline-block; word-wrap: break-word; text-align: left; }
        .message-me .message-content { background-color: #0d6efd; color: white; border-bottom-right-radius: 0; }
        .message-other .message-content { background-color: #e9ecef; color: black; border-bottom-left-radius: 0; }
        .message-sender { font-size: 0.8rem; color: #6c757d; margin-bottom: 2px; }
        .message-time { font-size: 0.7rem; color: rgba(255,255,255,0.8); display: block; margin-top: 5px; text-align: right; }
        .message-other .message-time { color: #6c757d; }
        .chat-input-area { padding: 15px 20px; background: white; border-top: 1px solid #ddd; }
        .attachment-preview { max-width: 200px; max-height: 200px; margin-top: 10px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); }
        .clearfix::after { content: ""; clear: both; display: table; }
        .message-actions { display: none; margin-top: 5px; text-align: right; }
        .message-box:hover .message-actions { display: block; }
        .message-actions button { font-size: 0.7rem; margin-left: 5px; padding: 2px 6px; border-radius: 4px; border: none; background: rgba(0,0,0,0.1); color: inherit; transition: 0.2s; }
        .message-actions button:hover { background: rgba(0,0,0,0.2); }
        .message-me .message-actions button { background: rgba(255,255,255,0.2); color: white; }
        .message-me .message-actions button:hover { background: rgba(255,255,255,0.4); }
        .message-other .message-actions { text-align: left; }
        .message-other .message-actions button { margin-left: 0; margin-right: 5px; }
        .message-me a { color: #fff; text-decoration: underline; font-weight: 500; }
        .message-other a { color: #0d6efd; text-decoration: underline; font-weight: 500; }
        .scroll-bottom-btn { position: fixed; bottom: 90px; right: 25px; border-radius: 50%; width: 45px; height: 45px; display: none; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .mention-highlight { color: #ffc107; font-weight: bold; background: rgba(0,0,0,0.15); padding: 1px 4px; border-radius: 4px; }
        .message-me .mention-highlight { color: #ffe69c; background: rgba(255,255,255,0.2); }
        .reply-quote { font-size: 0.8rem; background: rgba(0,0,0,0.05); padding: 6px 10px; border-left: 3px solid rgba(0,0,0,0.2); border-radius: 4px; margin-bottom: 8px; cursor: pointer; opacity: 0.9; }
        .message-me .reply-quote { background: rgba(255,255,255,0.15); border-left: 3px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 shadow-sm">
        <a class="navbar-brand" href="dashboard.html"><i class="fas fa-arrow-left me-2"></i> Chatter / Team Coordination</a>
        <span class="navbar-text ms-auto text-white" id="current-user-display"></span>
    </nav>

    <div class="px-3 py-2 bg-light border-bottom">
        <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="chat-search" placeholder="Search chat history...">
        </div>
    </div>

    <div class="chat-container clearfix" id="chat-messages">
        <div class="text-center text-muted my-3"><i class="fas fa-spinner fa-spin"></i> Loading messages...</div>
    </div>

    <button id="scroll-bottom-btn" class="btn btn-primary scroll-bottom-btn" title="Scroll to bottom"><i class="fas fa-chevron-down"></i></button>

    <div id="typing-indicator" class="text-muted fst-italic px-3 py-1" style="display: none; font-size: 0.8rem; background: white;"></div>

    <div class="chat-input-area">
        <div id="reply-mode-banner" class="mb-2 text-info fw-bold" style="display: none; font-size: 0.85rem; background: #f8f9fa; padding: 8px 12px; border-radius: 5px; border-left: 4px solid #0dcaf0;">
            <div class="d-flex justify-content-between align-items-center">
                <span><i class="fas fa-reply"></i> Replying to <span id="reply-to-user"></span></span>
                <button class="btn btn-sm text-danger p-0" id="btn-cancel-reply" title="Cancel Reply"><i class="fas fa-times-circle"></i></button>
            </div>
            <div id="reply-to-text" class="text-muted fw-normal text-truncate mt-1" style="max-width: 100%;"></div>
        </div>
        <div id="edit-mode-banner" class="mb-2 text-warning fw-bold" style="display: none;">
            <i class="fas fa-edit"></i> Editing Message
            <button class="btn btn-sm text-danger p-0 ms-3" id="btn-cancel-edit" title="Cancel Edit"><i class="fas fa-times-circle"></i></button>
        </div>
        <div id="attachment-name" class="mb-2 text-muted" style="display: none; background: #f8f9fa; padding: 5px 10px; border-radius: 5px; border: 1px solid #dee2e6; width: fit-content;">
            <i class="fas fa-file-alt text-primary"></i> <span id="file-name-text" class="ms-1 fw-bold"></span>
            <button class="btn btn-sm text-danger p-0 ms-3" id="btn-remove-file" title="Remove Attachment"><i class="fas fa-times-circle"></i></button>
        </div>
        <div class="input-group">
            <input type="file" id="file-input" style="display: none;">
            <button class="btn btn-outline-secondary" type="button" id="btn-attach" title="Attach File"><i class="fas fa-paperclip"></i></button>
            <input type="text" class="form-control" id="chat-input" placeholder="Type a message to coordinate with the team..." autocomplete="off">
            <button class="btn btn-primary px-4" type="button" id="btn-send"><i class="fas fa-paper-plane me-1"></i> Send</button>
        </div>
    </div>

    <script src="apiClient.js"></script>
    <script src="chatter.js"></script>
</body>
</html>
