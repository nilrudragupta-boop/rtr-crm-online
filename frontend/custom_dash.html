<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Objects | RISE Tech Revolution</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="apiClient.js"></script>
    <style>
        :root {
            --slds-blue: #0176d3;
            --slds-dark-blue: #0b5cab;
            --slds-bg: #f3f3f3;
            --slds-text: #181818;
            --slds-border: #dddbda;
            --slds-card-shadow: 0 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--slds-bg);
            color: var(--slds-text);
        }

        /* --- Header & Navigation --- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 12px 24px;
            border-bottom: 1px solid var(--slds-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--slds-blue);
            letter-spacing: 0.5px;
        }

        .search-container {
            flex: 0 1 400px;
        }

        .search-container input {
            width: 100%;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--slds-border);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            border-color: var(--slds-blue);
        }

        .navbar {
            background: #fff;
            padding: 0 24px;
            border-bottom: 1px solid var(--slds-border);
            display: flex;
            gap: 24px;
        }

        .navbar a {
            padding: 12px 0;
            color: #444;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 3px solid transparent;
            cursor: grab;
        }

        .navbar a:active {
            cursor: grabbing;
        }

        .navbar a.active {
            color: var(--slds-blue);
            border-bottom-color: var(--slds-blue);
            font-weight: 600;
        }

        /* --- Content Area --- */
        .content {
            padding: 24px;
            max-width: 1600px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .page-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 400;
        }

        /* --- Table Card --- */
        .table-card {
            background: #fff;
            border: 1px solid var(--slds-border);
            border-radius: 4px;
            box-shadow: var(--slds-card-shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: #f8f9fa;
            text-align: left;
            padding: 12px;
            border-bottom: none;
            box-shadow: inset 0 -2px 0 var(--slds-border);
            color: #444;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--slds-border);
        }

        tr:hover {
            background: #f1f7fb;
        }

        /* --- Buttons --- */
        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--slds-border);
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        button.primary {
            background: var(--slds-blue);
            color: white;
            border: none;
        }

        button.primary:hover {
            background: var(--slds-dark-blue);
        }

        /* --- Modal & Settings --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: #fff;
            margin: 5% auto;
            padding: 0;
            width: 95%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--slds-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 12px;
            border-top: 1px solid var(--slds-border);
            text-align: right;
            background: #f8f9fa;
            border-radius: 0 0 8px 8px;
        }

        #fieldOrderList li {
            padding: 10px;
            border: 1px solid var(--slds-border);
            margin-bottom: 5px;
            border-radius: 4px;
            background: #fff;
            display: flex;
            align-items: center;
        }

        /* --- Pagination --- */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 4px;
            border: 1px solid var(--slds-border);
            box-shadow: var(--slds-card-shadow);
        }

        .pagination {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid var(--slds-border);
            background: #fff;
            cursor: pointer;
            border-radius: 4px;
            color: #444;
        }

        .pagination button.active {
            background: var(--slds-blue);
            color: #fff;
            border-color: var(--slds-blue);
        }

        .pagination button:disabled {
            background: #f8f9fa;
            cursor: not-allowed;
            color: #999;
        }

        .pagination span {
            padding: 0 5px;
            color: #666;
        }

        .sort-icon {
            font-size: 11px;
            color: #888;
            margin-left: 4px;
        }

        /* --- Action Dropdown & Column Resizing --- */
        .action-dropdown {
            position: relative;
            display: inline-block;
        }

        .action-btn-main {
            background-color: #607d8b;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .action-dropdown-content {
            display: none;
            position: fixed;
            background-color: #fff;
            min-width: 120px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            border: 1px solid var(--slds-border);
            border-radius: 4px;
            padding: 4px 0;
            text-align: left;
        }

        .action-dropdown-content button {
            color: #333 !important;
            background: none !important;
            padding: 8px 16px !important;
            text-decoration: none !important;
            display: block !important;
            width: 100% !important;
            text-align: left !important;
            border: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            font-weight: normal !important;
            font-size: 13px !important;
        }

        .action-dropdown-content button:hover {
            background-color: #f1f1f1 !important;
            color: #000 !important;
        }

        .action-dropdown.active .action-dropdown-content {
            display: block;
        }

        #customTable th {
            position: relative;
        }

        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 11;
        }

        .resizer:hover,
        .resizing {
            background-color: var(--slds-blue);
            opacity: 0.5;
        }

        /* --- Spinner & Progress Bar --- */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--slds-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-container {
            width: 80%;
            max-width: 400px;
            background-color: #e0e0e0;
            border-radius: 8px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid var(--slds-border);
        }
        .progress-bar {
            height: 20px;
            background-color: var(--slds-blue);
            width: 0%;
            transition: width 0.1s ease-in-out;
        }
        .progress-text {
            margin-top: 10px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="logo">RISE TECH REVOLUTION</div>
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search...">
        </div>
        <div class="profile" style="font-weight:600; color:#555;">Admin User</div>
    </header>

    <nav class="navbar" id="mainNavbar">
    </nav>

    <!-- Dynamic Custom Object Section -->
    <section class="content" id="customObjectContent">
        <div class="page-header">
            <h2 id="customObjectTitle">Custom Object</h2>
            <div style="display: flex; gap: 10px;">
                <button id="bulkDeleteBtn" onclick="deleteSelectedRecords()"
                    style="background: #e74c3c; color: white; border: none; display: none;">🗑️ Delete Selected</button>
                <button onclick="openTableSettingsModal()"><i class="fas fa-cog"></i> ⚙️ Settings</button>
                <button onclick="openFieldOrderModal()"><i class="fas fa-sort"></i> ↕️ Field Order</button>
                <button onclick="printTableReport()"><i class="fas fa-print"></i> 🖨️ Print Report</button>
                <button onclick="exportData()" style="background: #27ae60; color: white; border: none;">Export
                    Excel</button>
                <button onclick="document.getElementById('importDataInput').click()"
                    style="background: #17a2b8; color: white; border: none;">Import Data</button>
                <input type="file" id="importDataInput" style="display: none;" accept=".xlsx, .xls, .csv"
                    onchange="importData(this)">
                <button class="primary" onclick="openCustomRecordModal()">+ New Record</button>
            </div>
        </div>
        <div class="table-card" style="overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 240px);">
            <table id="customTable">
                <thead id="customTableHead"></thead>
                <tbody id="customTableBody"></tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-container" id="paginationWrapper" style="display:none;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="totalRecordsDisplay" style="font-weight: bold; color: var(--slds-blue);"></span>
                <select id="rowsPerPageSelect" onchange="changeRowsPerPage()"
                    style="padding: 6px; border: 1px solid var(--slds-border); border-radius: 4px; font-size: 13px;">
                    <option value="50" selected>50 rows</option>
                    <option value="100">100 rows</option>
                    <option value="200">200 rows</option>
                    <option value="500">500 rows</option>
                </select>
            </div>
            <div id="paginationInfo" style="color: #666; font-size: 13px;"></div>
            <div class="pagination" id="paginationControls"></div>
        </div>
    </section>

    <!-- Dynamic Form Modal -->
    <div id="customRecordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size: 1.1rem;" id="customModalTitle">New Record</h3>
                <span style="font-size:24px; cursor:pointer;" onclick="closeCustomRecordModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;" id="customFormContainer"></div>
            </div>
            <div class="modal-footer">
                <button onclick="closeCustomRecordModal()">Cancel</button>
                <button class="primary" onclick="saveCustomRecord()">Save</button>
            </div>
        </div>
    </div>

    <!-- Table Settings Modal -->
    <div id="tableSettingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size: 1.1rem;">Table Settings</h3>
                <span style="font-size:24px; cursor:pointer;"
                    onclick="document.getElementById('tableSettingsModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 10px; display: flex; gap: 10px;">
                    <button onclick="toggleAllColumns(true)">Select All</button>
                    <button onclick="toggleAllColumns(false)">Deselect All</button>
                </div>
                <div id="columnToggles" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
            </div>
            <div class="modal-footer">
                <button onclick="document.getElementById('tableSettingsModal').style.display='none'">Close</button>
                <button class="primary" onclick="saveColumnSettings()">Apply</button>
            </div>
        </div>
    </div>

    <!-- Field Order Modal -->
    <div id="fieldOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size: 1.1rem;">Field Order</h3>
                <span style="font-size:24px; cursor:pointer;"
                    onclick="document.getElementById('fieldOrderModal').style.display='none'">&times;</span>
            </div>
            <div class="modal-body">
                <ul id="fieldOrderList" style="list-style: none; padding: 0; margin: 0;"></ul>
            </div>
            <div class="modal-footer">
                <button onclick="document.getElementById('fieldOrderModal').style.display='none'">Close</button>
                <button class="primary" onclick="saveFieldOrder()">Save Order</button>
            </div>
        </div>
    </div>

    <!-- Import Mapping Modal -->
    <div id="importMappingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size: 1.1rem;">Map Import Fields</h3>
                <span style="font-size:24px; cursor:pointer;" onclick="closeImportMappingModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p style="margin-top:0; font-size:13px; color:#555;">Select which Excel columns correspond to your fields. Uncheck fields you do not wish to update.</p>
                <div id="importMappingContainer" style="display: grid; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px;"></div>
            </div>
            <div class="modal-footer">
                <button onclick="closeImportMappingModal()">Cancel</button>
                <button class="primary" onclick="processImportData()">Confirm Import</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:9999; flex-direction:column; justify-content:center; align-items:center;">
        <div class="spinner"></div>
        <div class="progress-container" id="importProgressContainer" style="display: none;">
            <div class="progress-bar" id="importProgressBar"></div>
        </div>
        <div class="progress-text" id="importProgressText" style="display: none;">Processing 0 of 0...</div>
    </div>

    <script>
        function handleSearch() {
            currentPage = 1;
            renderCustomTable();
        }

        // Initialize
        window.onload = async () => {
            const currentUser = localStorage.getItem('currentUser') || 'System';
            const profileEl = document.querySelector('.profile');
            if (profileEl) profileEl.innerText = currentUser;

            try {
                if (typeof apiClient !== 'undefined') {
                    if (apiClient.getCustomFields) {
                        const res = await apiClient.getCustomFields();
                        const fields = Array.isArray(res) ? res : (res?.data || null);
                        if (fields) {
                            customFields = fields;
                            localStorage.setItem('CUSTOM_FIELDS', JSON.stringify(customFields));
                        } else {
                            customFields = JSON.parse(localStorage.getItem('CUSTOM_FIELDS')) || [];
                        }
                    }

                    if (apiClient.getSettings) {
                        const res = await apiClient.getSettings();
                        const settings = res?.data || res || {};
                        if (settings && settings.crmCustomPages) {
                            localStorage.setItem('crmCustomPages', JSON.stringify(settings.crmCustomPages));
                        }
                    }
                } else {
                    customFields = JSON.parse(localStorage.getItem('CUSTOM_FIELDS')) || [];
                }
            } catch (e) {
                customFields = JSON.parse(localStorage.getItem('CUSTOM_FIELDS')) || [];
            }

            customPages = JSON.parse(localStorage.getItem('crmCustomPages')) || [];
            customPages = customPages.filter(p => p.createdBy === currentUser);

            loadCustomTabs();
            if (customPages.length > 0) {
                const urlParams = new URLSearchParams(window.location.search);
                const targetPageId = urlParams.get('pageId');

                let targetTab = null;
                if (targetPageId) {
                    const tabs = document.querySelectorAll('#mainNavbar a');
                    tabs.forEach(tab => {
                        if (tab.dataset.pageId === targetPageId) targetTab = tab;
                    });
                }

                if (targetTab) {
                    targetTab.click();
                } else {
                    const firstTab = document.querySelector('#mainNavbar a');
                    if (firstTab) firstTab.click();
                }
            } else {
                document.getElementById('customObjectContent').style.display = 'block';
                document.getElementById('customObjectTitle').innerText = 'No Custom Objects Found';
                document.getElementById('customTableHead').innerHTML = '';
                document.getElementById('customTableBody').innerHTML = '<tr><td style="text-align:center; padding: 30px;">Go to Object Manager to create custom objects.</td></tr>';
                const headerDiv = document.querySelector('.page-header div');
                if (headerDiv) {
                    headerDiv.style.display = 'none';
                }
            }

            if (navigator.onLine) {
                syncOfflineCustomRecords();
            }
        };

        // --- Custom Objects Logic ---
        let customPages = JSON.parse(localStorage.getItem('crmCustomPages')) || [];
        let customFields = [];
        let currentActivePageId = null;
        let editCustomRecordId = null;
        let currentCustomFields = [];
        let columnVisibility = {};

        let currentPage = 1;
        let rowsPerPage = 50;
        let currentSortColumn = null;
        let currentSortDirection = 'asc';
        let currentFilteredData = [];

        function loadCustomTabs() {
            const nav = document.getElementById('mainNavbar');
            nav.innerHTML = '';
            customPages.forEach(p => {
                const a = document.createElement('a');
                a.href = "#";
                a.innerText = p.label;
                a.dataset.pageId = p.pageId;
                a.onclick = function (e) { e.preventDefault(); switchTab(p.pageId, this, p.label); };
                nav.appendChild(a);
            });

            if (typeof Sortable !== 'undefined') {
                new Sortable(nav, {
                    animation: 150,
                    onEnd: async function (evt) {
                        let allPages = JSON.parse(localStorage.getItem('crmCustomPages')) || [];
                        const currentUser = localStorage.getItem('currentUser') || 'System';
                        let otherUsersPages = allPages.filter(p => p.createdBy !== currentUser);

                        const movedItem = customPages.splice(evt.oldIndex, 1)[0];
                        customPages.splice(evt.newIndex, 0, movedItem);
                        const updatedAllPages = [...otherUsersPages, ...customPages];
                        localStorage.setItem('crmCustomPages', JSON.stringify(updatedAllPages));

                        if (typeof apiClient !== 'undefined' && apiClient.getSettings && apiClient.saveSettings) {
                            try {
                                const res = await apiClient.getSettings();
                                const settings = res?.data || res || {};
                                settings.crmCustomPages = updatedAllPages;
                                await apiClient.saveSettings(settings);
                            } catch (e) { }
                        }
                    }
                });
            }
        }

        async function switchTab(pageId, tabElement, pageLabel = '') {
            document.querySelectorAll('#mainNavbar a').forEach(a => a.classList.remove('active'));
            tabElement.classList.add('active');
            currentActivePageId = pageId;
            const searchInput = document.getElementById('searchInput');

            document.getElementById('customObjectContent').style.display = 'block';
            document.getElementById('customObjectTitle').innerText = pageLabel;
            searchInput.placeholder = `Search ${pageLabel}...`;
            const currentUser = localStorage.getItem('currentUser') || 'System';
            currentCustomFields = customFields.filter(f => f.moduleName === pageId && f.createdBy === currentUser).sort((a, b) => (a.order || 0) - (b.order || 0));
            columnVisibility = JSON.parse(localStorage.getItem('customDashColVis_' + pageId)) || {};
            currentPage = 1;
            currentSortColumn = null;
            currentSortDirection = 'asc';
            document.getElementById('paginationWrapper').style.display = 'flex';

            // Fetch from backend
            try {
                if (typeof apiClient !== 'undefined' && apiClient.getCustomRecords) {
                    const res = await apiClient.getCustomRecords(pageId);
                    let records = Array.isArray(res) ? res : (res?.data || []);
                    records = records.filter(r => r.createdBy === currentUser);

                    let localData = JSON.parse(localStorage.getItem('data_' + pageId));
                    if (!Array.isArray(localData)) localData = [];
                    let localUserData = localData.filter(r => r.createdBy === currentUser);

                    const fetchedMap = new Map(records.map(r => [r._id || r.id, r]));

                    localUserData.forEach(localRecord => {
                        if (localRecord && (localRecord._id || localRecord.id)) {
                            const recId = localRecord._id || localRecord.id;
                            if (!fetchedMap.has(recId)) {
                                records.push(localRecord);
                            } else {
                                const apiRecord = fetchedMap.get(recId);
                                const localTime = new Date(localRecord.updatedAt || 0).getTime();
                                const apiTime = new Date(apiRecord.updatedAt || 0).getTime();
                                if (localTime > apiTime) {
                                    const idx = records.findIndex(r => (r._id || r.id) === recId);
                                    if (idx > -1) records[idx] = localRecord;
                                }
                            }
                        }
                    });

                    const mappedRecords = records.map(r => ({ ...r, id: r._id || r.id }));
                    const otherUsersData = localData.filter(r => r.createdBy !== currentUser);
                    localStorage.setItem('data_' + pageId, JSON.stringify([...otherUsersData, ...mappedRecords]));
                }
            } catch (e) {
                console.warn("Failed to fetch custom records from API", e);
            }

            renderCustomTable();
        }

        function renderCustomTable() {
            const allData = JSON.parse(localStorage.getItem('data_' + currentActivePageId)) || [];
            const currentUser = localStorage.getItem('currentUser') || 'System';
            const data = allData.filter(r => r.createdBy === currentUser);
            const thead = document.getElementById('customTableHead');
            const tbody = document.getElementById('customTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (currentCustomFields.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = '<tr><td style="text-align:center; padding: 30px;">No fields defined yet. Go to Object Manager to add fields.</td></tr>';
                document.getElementById('paginationWrapper').style.display = 'none';
                return;
            } else {
                document.getElementById('paginationWrapper').style.display = 'flex';
            }

            const visibleFields = currentCustomFields.filter(f => {
                if (columnVisibility[f.fieldName] !== undefined) return columnVisibility[f.fieldName];
                return f.showInGrid !== false;
            });

            let thHTML = '<tr><th style="width: 40px;"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAllRecords(this)"></th><th>S.No</th>';
            visibleFields.forEach(f => {
                const icon = currentSortColumn === f.fieldName ? (currentSortDirection === 'asc' ? '▲' : '▼') : '';
                thHTML += `<th style="cursor:pointer;" onclick="handleSort('${f.fieldName}')">${f.fieldLabel} <span class="sort-icon">${icon}</span></th>`;
            });
            thHTML += '<th style="text-align: center; width: 100px;">Actions</th></tr>';
            thead.innerHTML = thHTML;

            tbody.innerHTML = '';
            currentFilteredData = data.filter(row => {
                return Object.values(row).some(v => String(v).toLowerCase().includes(searchTerm));
            });

            if (currentSortColumn) {
                currentFilteredData.sort((a, b) => {
                    let valA = String(a[currentSortColumn] || "").toLowerCase();
                    let valB = String(b[currentSortColumn] || "").toLowerCase();

                    const numA = parseFloat(valA);
                    const numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB)) {
                        return currentSortDirection === 'asc' ? numA - numB : numB - numA;
                    }

                    return currentSortDirection === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                });
            }

            const totalItems = currentFilteredData.length;
            const totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, totalItems);
            const paginatedData = currentFilteredData.slice(startIndex, endIndex);

            if (paginatedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${visibleFields.length + 3}" style="text-align:center; padding: 30px;">No records found.</td></tr>`;
            } else {
                paginatedData.forEach((row, i) => {
                    let tr = `<tr><td><input type="checkbox" class="record-checkbox" value="${row.id}" onclick="updateBulkDeleteBtn()"></td><td>${startIndex + i + 1}</td>`;
                    visibleFields.forEach(f => {
                        let val;
                        if (f.fieldType === 'calculated' && f.calculationFormula) {
                            try {
                                let formula = f.calculationFormula.toString();
                                // Auto-correct missing braces around field keys for backwards compatibility
                                formula = formula.replace(/(^|[^a-zA-Z0-9_{])(cf_[a-zA-Z0-9_]+)(?=[^a-zA-Z0-9_}]|$)/g, '$1{$2}');
                                const fieldNamesInFormula = formula.match(/{[^{}]+}/g) || [];
                                let formulaIsValid = true;
                                
                                fieldNamesInFormula.forEach(placeholder => {
                                    const fieldName = placeholder.substring(1, placeholder.length - 1);
                                    let v = row[fieldName];
                                    if (v === undefined || v === null || v === '') {
                                        formulaIsValid = false;
                                    }
                                    const fieldValue = parseFloat(v) || 0;
                                    formula = formula.split(placeholder).join(fieldValue);
                                });
                                
                                if (formulaIsValid) {
                                    val = new Function('return ' + formula)();
                                    if (typeof val === 'number' && (!isFinite(val) || isNaN(val))) val = '#CALC!';
                                } else {
                                    val = null;
                                }
                            } catch (e) { console.error("Calculation error for field", f.fieldName, e); val = '#CALC!'; }
                        } else {
                            val = row[f.fieldName];
                        }
                        if (val !== undefined && val !== null && val !== '') {
                            if (f.fieldType === 'currency' || f.fieldType === 'number' || (f.fieldType === 'calculated' && typeof val === 'number')) {
                                let num = parseFloat(val);
                                if (!isNaN(num)) {
                                    val = num.toLocaleString('en-IN', { minimumFractionDigits: f.currencyDecimals ?? 2, maximumFractionDigits: f.currencyDecimals ?? 2 });
                                    if (f.prefix || f.currencySymbol) val = (f.prefix || f.currencySymbol) + ' ' + val;
                                    if (f.suffix) val = val + ' ' + f.suffix;
                                }
                            } else if (f.fieldType === 'date') {
                                const d = new Date(val);
                                if (!isNaN(d.getTime())) val = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
                            } else if (f.fieldType === 'datetime') {
                                const d = new Date(val);
                                if (!isNaN(d.getTime())) val = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()} ${d.toLocaleTimeString('en-IN')}`;
                            } else {
                                if (f.prefix) val = f.prefix + ' ' + val;
                                if (f.suffix) val = val + ' ' + f.suffix;
                            }
                        } else {
                            val = '-';
                        }
                        tr += `<td>${val}</td>`;
                    });
                    tr += `<td style="text-align: center;">
                        <div class="action-dropdown" id="actionDropdown-${row.id}">
                            <button class="action-btn-main" onclick="toggleActionMenu(this)">Actions ▼</button>
                            <div class="action-dropdown-content">
                                <button onclick="editCustomRecord('${row.id}')">✏️ Edit</button>
                                <button onclick="deleteCustomRecord('${row.id}')" style="color: #dc3545 !important;">🗑️ Delete</button>
                            </div>
                        </div>
                    </td></tr>`;
                    tbody.innerHTML += tr;
                });
            }

            renderPagination(totalItems, startIndex + 1, endIndex, totalPages);
            updateBulkDeleteBtn();

            requestAnimationFrame(() => {
                loadColumnWidths();
                enableColumnResizing();
            });
        }

            container.innerHTML = '';

                const reqHtml = f.isRequired ? '<span style="color:red">*</span>' : '';

                let inputHtml = '';
                if (f.fieldType === 'calculated') {
                    inputHtml = `<input type="text" id="${f.fieldName}" value="${val}" readonly style="width:100%; padding:8px; border:1px solid var(--slds-border); border-radius:4px; background-color:#f1f3f5; cursor:not-allowed;" />`;

                    (f.options || []).forEach(o => inputHtml += `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`);
                    inputHtml += `</select>`;
                } else if (f.fieldType === 'textarea') {
                    inputHtml = `<textarea id="${f.fieldName}" oninput="updateCalculatedFieldsInModal()" style="width:100%; padding:8px; border:1px solid var(--slds-border); border-radius:4px; grid-column: 1 / -1;">${val}</textarea>`;
                } else if (f.fieldType === 'lookup') {
                    let lookupOptions = [];
                    try {
                        const targetModule = f.lookupModule;
                        const displayField = f.lookupDisplay;
                        
                        if (targetModule) {
                            if (targetModule.toLowerCase() === 'customer' || targetModule.toLowerCase() === 'customers') {
                                const customers = JSON.parse(localStorage.getItem('customers')) || [];
                                lookupOptions = customers.map(c => displayField ? c[displayField] : (c.name || c.id));
                            } else if (targetModule.toLowerCase() === 'supplier' || targetModule.toLowerCase() === 'suppliers') {

                    inputHtml = `<input type="text" id="${f.fieldName}" value="${val}" list="lookupList_${f.fieldName}" oninput="updateCalculatedFieldsInModal()" style="width:100%; padding:8px; border:1px solid var(--slds-border); border-radius:4px;" />`;

                    inputHtml = `<input type="${f.fieldType === 'number' ? 'number' : (f.fieldType === 'date' ? 'date' : 'text')}" id="${f.fieldName}" value="${val}" oninput="updateCalculatedFieldsInModal()" style="width:100%; padding:8px; border:1px solid var(--slds-border); border-radius:4px;" />`;

        function updateCalculatedFieldsInModal() {
            currentCustomFields.forEach(f => {
                if (f.fieldType === 'calculated' && f.calculationFormula) {
                    try {
                        let formula = f.calculationFormula.toString();
                        // Auto-correct missing braces around field keys
                        formula = formula.replace(/(^|[^a-zA-Z0-9_{])(cf_[a-zA-Z0-9_]+)(?=[^a-zA-Z0-9_}]|$)/g, '$1{$2}');
                        const fieldNamesInFormula = formula.match(/{[^{}]+}/g) || [];
                        let formulaIsValid = true;
                        
                        fieldNamesInFormula.forEach(placeholder => {
                            const fieldName = placeholder.substring(1, placeholder.length - 1);
                            const inputEl = document.getElementById(fieldName);

                            if (val === undefined || val === null || val === '') {

        async function saveCustomRecord() {
            let newId = editCustomRecordId || ('cr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5));
            let currentUser = localStorage.getItem('currentUser') || 'System';
            let newRow = { id: newId, _id: newId, moduleName: currentActivePageId, createdBy: currentUser, updatedAt: new Date().toISOString() };
            let apiPayload = { _id: newId, moduleName: currentActivePageId, createdBy: currentUser, updatedAt: new Date().toISOString() };
            let hasError = false;

            const allData = JSON.parse(localStorage.getItem('data_' + currentActivePageId)) || [];
            let data = allData.filter(r => r.createdBy === currentUser);
            const otherUsersData = allData.filter(r => r.createdBy !== currentUser);

            if (editCustomRecordId) {
                const existing = data.find(r => r.id === editCustomRecordId || r._id === editCustomRecordId);
                if (existing) {
                    newRow.createdBy = existing.createdBy || currentUser;
                    apiPayload.createdBy = existing.createdBy || currentUser;
                    newRow.createdAt = existing.createdAt || new Date().toISOString();
                    apiPayload.createdAt = existing.createdAt || new Date().toISOString();
                }
            } else {
                newRow.createdAt = new Date().toISOString();
                apiPayload.createdAt = new Date().toISOString();
            }

            currentCustomFields.forEach(f => {
                const val = document.getElementById(f.fieldName).value;
                if (f.isRequired && !val) hasError = true;
                newRow[f.fieldName] = val;
                apiPayload[f.fieldName] = val;
            });

            if (hasError) return alert("Please fill all required fields");

            if (typeof apiClient !== 'undefined' && apiClient.saveCustomRecord) {
                try {
                    const res = await apiClient.saveCustomRecord(apiPayload);
                    if (res && res.data && res.data._id) {
                        newRow.id = res.data._id;
                        newRow._id = res.data._id;
                    }
                } catch (err) { console.warn("API sync failed", err); }
            }

            if (editCustomRecordId) {
                const index = data.findIndex(r => r.id === editCustomRecordId || r._id === editCustomRecordId);
                if (index !== -1) data[index] = newRow;
            } else {
                data.push(newRow);
            }

            localStorage.setItem('data_' + currentActivePageId, JSON.stringify([...otherUsersData, ...data]));
            closeCustomRecordModal();
            renderCustomTable();
        }

        async function deleteCustomRecord(id, skipConfirm = false) {
            if (!skipConfirm && !confirm("Delete this record?")) return;
            let allData = JSON.parse(localStorage.getItem('data_' + currentActivePageId)) || [];
            const currentUser = localStorage.getItem('currentUser') || 'System';
            let data = allData.filter(r => r.createdBy === currentUser);
            const otherUsersData = allData.filter(r => r.createdBy !== currentUser);
            data = data.filter(r => r.id !== id && r._id !== id);

            if (typeof apiClient !== 'undefined' && apiClient.deleteCustomRecord) {
                await apiClient.deleteCustomRecord(id).catch(err => console.warn("API delete failed", err));
            }

            localStorage.setItem('data_' + currentActivePageId, JSON.stringify([...otherUsersData, ...data]));
            if (!skipConfirm) renderCustomTable();
        }

        let pendingImportData = [];
        let pendingImportHeaders = [];

        function importData(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                pendingImportData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

                if (pendingImportData.length === 0) {
                    alert("The file is empty or formatted incorrectly.");
                    input.value = '';
                    return;
                }

                // Extract headers from the first data row
                pendingImportHeaders = Object.keys(pendingImportData[0] || {});
                showImportMappingModal();
                input.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        async function processImportData() {
            let currentUser = localStorage.getItem('currentUser') || 'System';
            let allData = JSON.parse(localStorage.getItem('data_' + currentActivePageId)) || [];
            let savedData = allData.filter(r => r.createdBy === currentUser);
            const otherUsersData = allData.filter(r => r.createdBy !== currentUser);
            let added = 0;
            let updated = 0;

             const totalRows = pendingImportData.length;
            let processedRows = 0;

            const overlay = document.getElementById('loadingOverlay');
            const progressContainer = document.getElementById('importProgressContainer');
            const progressBar = document.getElementById('importProgressBar');
            const progressText = document.getElementById('importProgressText');

            // 1. Show overlay UI
            if (overlay) overlay.style.display = 'flex';
            if (progressContainer) progressContainer.style.display = 'block';
            if (progressText) {
                progressText.style.display = 'block';
                progressText.innerText = `Processing 0 of ${totalRows}...`;
            }

            // 2. Add a tiny delay so the browser can paint the overlay to the screen
            await new Promise(resolve => setTimeout(resolve, 50));

            try {
                // Gather mapping config from checkboxes
                const fieldMapping = {};
                currentCustomFields.forEach(f => {
                    const mapSelect = document.getElementById('map_' + f.fieldName);
                    const importCheck = document.getElementById('import_' + f.fieldName);
                    if (mapSelect && importCheck && importCheck.checked && mapSelect.value) {
                        fieldMapping[f.fieldName] = mapSelect.value;
                    }
                });

                const idMapSelect = document.getElementById('map_record_id');
                const idMapping = idMapSelect ? idMapSelect.value : null;

                for (const row of pendingImportData) {
                    // Match existing records
                    let recordId = null;
                    if (idMapping && row[idMapping] !== undefined) {
                        recordId = String(row[idMapping]).trim();
                    } else {
                        const idKey = Object.keys(row).find(k => ['record id', 'id', '_id'].includes(k.trim().toLowerCase()));
                        if (idKey && row[idKey] !== undefined) recordId = String(row[idKey]).trim();
                    }

                    let isUpdate = false;
                    let existingRecord = {};
                    let newId = null;

                    if (recordId) {
                        const existingIdx = savedData.findIndex(r => String(r.id) === recordId || String(r._id) === recordId);
                        if (existingIdx > -1) {
                            isUpdate = true;
                            existingRecord = savedData[existingIdx];
                            newId = existingRecord.id || existingRecord._id;
                        }
                    }

                    if (!newId) newId = 'cr_' + Date.now().toString() + '_' + Math.random().toString(36).substr(2, 5);

                    // Use existingRecord as the baseline, preserving unmapped values 
                    let newRow = { ...existingRecord, id: newId, _id: newId, moduleName: currentActivePageId, updatedAt: new Date().toISOString() };
                    let apiPayload = { ...existingRecord, _id: newId, moduleName: currentActivePageId, updatedAt: new Date().toISOString() };

                    if (!isUpdate) {
                        newRow.createdBy = currentUser;
                        newRow.createdAt = new Date().toISOString();
                        apiPayload.createdBy = currentUser;
                        apiPayload.createdAt = new Date().toISOString();
                    }

                    currentCustomFields.forEach(f => {
                        const mappedHeader = fieldMapping[f.fieldName];
                        
                        if (mappedHeader) {
                            let val = row[mappedHeader];
                            if (val !== undefined) {
                                if (val instanceof Date) {
                                    const offset = val.getTimezoneOffset() * 60000;
                                    const localDate = new Date(val.getTime() - offset);
                                    if (f.fieldType === 'date') val = localDate.toISOString().split('T')[0];
                                    else if (f.fieldType === 'datetime') val = localDate.toISOString().slice(0, 16);
                                }
                                if (!(isUpdate && val === '')) {
                                    newRow[f.fieldName] = val;
                                    apiPayload[f.fieldName] = val;
                                }
                            }
                        } else if (!isUpdate && existingRecord[f.fieldName] === undefined) {
                            // Initialize unmapped fields on entirely new records
                            newRow[f.fieldName] = '';
                            apiPayload[f.fieldName] = '';
                        }
                    });

                    if (typeof apiClient !== 'undefined' && apiClient.saveCustomRecord) {
                        try {
                            const res = await apiClient.saveCustomRecord(apiPayload);
                            if (res && res.data && res.data._id && !isUpdate) {
                                newRow.id = res.data._id;
                                newRow._id = res.data._id;
                            }
                        } catch (err) { console.warn("API sync failed", err); }
                    }

                    if (isUpdate) {
                        const idx = savedData.findIndex(r => r.id === newRow.id || r._id === newRow._id);
                        savedData[idx] = newRow;
                        updated++;
                    } else {
                        savedData.push(newRow);
                        added++;
                    }

                    // 3. Update Progress Bar state
                    processedRows++;
                    if (progressBar) progressBar.style.width = Math.round((processedRows / totalRows) * 100) + '%';
                    if (progressText) progressText.innerText = `Processing ${processedRows} of ${totalRows}...`;
                    
                    // 4. Yield briefly so the UI can draw the updated progress bar
                    if (processedRows % 10 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                localStorage.setItem('data_' + currentActivePageId, JSON.stringify([...otherUsersData, ...savedData]));
                renderCustomTable();
                alert(`Import successful: ${added} added, ${updated} updated.`);
                closeImportMappingModal();
            } finally {
                // 5. Securely wipe & hide overlay afterwards
                if (overlay) overlay.style.display = 'none';
                if (progressContainer) progressContainer.style.display = 'none';
                if (progressText) progressText.style.display = 'none';
                if (progressBar) progressBar.style.width = '0%';
            }
        }

        // --- Settings / Columns Logic ---
        function openTableSettingsModal() {
            if (!currentActivePageId) return alert("No active page.");
            const container = document.getElementById('columnToggles');
            container.innerHTML = '';
            currentCustomFields.forEach(f => {
                let isChecked = columnVisibility[f.fieldName];
                if (isChecked === undefined) isChecked = f.showInGrid !== false;

                const label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '8px';
                label.style.cursor = 'pointer';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = 'col_' + f.fieldName;
                cb.checked = isChecked;

                label.appendChild(cb);
                label.appendChild(document.createTextNode(f.fieldLabel));
                container.appendChild(label);
            });
            document.getElementById('tableSettingsModal').style.display = 'block';
        }

        function toggleAllColumns(state) {
            currentCustomFields.forEach(f => {
                const cb = document.getElementById('col_' + f.fieldName);
                if (cb) cb.checked = state;
            });
        }

        function saveColumnSettings() {
            currentCustomFields.forEach(f => {
                const cb = document.getElementById('col_' + f.fieldName);
                if (cb) columnVisibility[f.fieldName] = cb.checked;
            });
            localStorage.setItem('customDashColVis_' + currentActivePageId, JSON.stringify(columnVisibility));
            document.getElementById('tableSettingsModal').style.display = 'none';
            renderCustomTable();
        }

        // --- Field Order Logic ---
        function openFieldOrderModal() {
            if (!currentActivePageId) return alert("No active page.");
            const list = document.getElementById('fieldOrderList');
            list.innerHTML = '';
            currentCustomFields.forEach(f => {
                const li = document.createElement('li');
                li.dataset.fieldId = f._id || f.fieldName;
                li.innerHTML = `<span style="color:#999; cursor:grab; margin-right:10px;">☰</span> <span>${f.fieldLabel}</span> <code style="font-size:11px;color:#666;margin-left:auto;">${f.fieldName}</code>`;
                list.appendChild(li);
            });
            if (typeof Sortable !== 'undefined') {
                new Sortable(list, { animation: 150 });
            }
            document.getElementById('fieldOrderModal').style.display = 'block';
        }

        async function saveFieldOrder() {
            const listItems = document.querySelectorAll('#fieldOrderList li');
            const newOrderIds = Array.from(listItems).map(li => li.dataset.fieldId);

            currentCustomFields.sort((a, b) => newOrderIds.indexOf(a._id || a.fieldName) - newOrderIds.indexOf(b._id || b.fieldName));
            currentCustomFields.forEach((f, i) => f.order = i);

            currentCustomFields.forEach(cf => {
                const idx = customFields.findIndex(f => (f._id || f.fieldName) === (cf._id || cf.fieldName));
                if (idx > -1) customFields[idx].order = cf.order;
            });
            localStorage.setItem('CUSTOM_FIELDS', JSON.stringify(customFields));

            if (typeof apiClient !== 'undefined' && apiClient.reorderCustomFields) {
                const payload = currentCustomFields.map(f => ({ _id: f._id, order: f.order }));
                apiClient.reorderCustomFields(payload).catch(console.warn);
            }

            document.getElementById('fieldOrderModal').style.display = 'none';
            renderCustomTable();
        }

        // --- Print Report Logic ---
        function printTableReport() {
            if (!currentActivePageId) return alert("No active page.");
            const tableHTML = document.getElementById('customTable').outerHTML;
            const title = document.getElementById('customObjectTitle').innerText;

            let html = `<!DOCTYPE html><html><head><title>Print Report - ${title}</title>
            <style>
                body { font-family: 'Segoe UI', sans-serif; padding: 20px; color: #333; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
                th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                th { background: #f8fafc; font-weight: 600; }
                @media print { .no-print { display: none !important; } th:last-child, td:last-child { display: none !important; } }
            </style></head><body>
            <h2 style="text-align:center;">${title} Report</h2>
            ${tableHTML}
            <div style="text-align:center; margin-top:30px;" class="no-print">
                <button onclick="window.print()" style="padding:10px 20px; font-size:16px; background:#0176d3; color:white; border:none; border-radius:4px; cursor:pointer;">Print</button>
            </div></body></html>`;

            const win = window.open('', '', 'width=900,height=700');
            win.document.write(html);
            win.document.close();
            win.focus();
        }

        // --- Sorting and Pagination Engine ---
        function handleSort(column) {
            if (currentSortColumn === column) {
                currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                currentSortDirection = 'asc';
            }
            renderCustomTable();
        }

        function changeRowsPerPage() {
            rowsPerPage = parseInt(document.getElementById('rowsPerPageSelect').value);
            currentPage = 1;
            renderCustomTable();
        }

        function changePage(page) {
            currentPage = page;
            renderCustomTable();
        }

        function renderPagination(totalItems, start, end, totalPages) {
            const info = document.getElementById("paginationInfo");
            const controls = document.getElementById("paginationControls");
            const totalDisplay = document.getElementById("totalRecordsDisplay");

            if (totalDisplay) totalDisplay.innerText = `Total Records: ${totalItems}`;

            if (totalItems === 0) {
                if (info) info.innerText = "No records found";
                if (controls) controls.innerHTML = "";
                return;
            }

            if (info) info.innerText = `Showing ${start} to ${end} of ${totalItems} entries`;
            let html = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const activeStyle = i === currentPage ? 'class="active"' : '';
                    html += `<button ${activeStyle} onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span>...</span>`;
                }
            }
            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;
            if (controls) controls.innerHTML = html;
        }

        // --- Auto-Sync Engine ---
        async function syncOfflineCustomRecords() {
            const currentUser = localStorage.getItem('currentUser') || 'System';
            if (!navigator.onLine || typeof apiClient === 'undefined' || !apiClient.saveCustomRecord) return;

            let allPages = JSON.parse(localStorage.getItem('crmCustomPages')) || [];
            let pages = allPages.filter(p => p.createdBy === currentUser);

            for (const p of pages) {
                const pageId = p.pageId;
                const allData = JSON.parse(localStorage.getItem('data_' + pageId)) || [];
                const userData = allData.filter(r => r.createdBy === currentUser);
                const otherUsersData = allData.filter(r => r.createdBy !== currentUser);
                let updated = false;

                for (let i = 0; i < userData.length; i++) {
                    const record = userData[i];
                    try {
                        let apiPayload = { ...record };
                        if (!apiPayload._id && apiPayload.id) apiPayload._id = apiPayload.id;

                        const res = await apiClient.saveCustomRecord(apiPayload);
                        if (res && res.data && res.data._id && !record._id) {
                            userData[i].id = res.data._id;
                            userData[i]._id = res.data._id;
                            updated = true;
                        }
                    } catch (e) {
                        console.warn("Auto-sync failed for record:", record.id, e);
                    }
                }

                if (updated) {
                    localStorage.setItem('data_' + pageId, JSON.stringify([...otherUsersData, ...userData]));
                }
            }
        }

        window.addEventListener('online', () => {
            syncOfflineCustomRecords().then(() => {
                if (currentActivePageId) handleSearch(); // Refresh active view
            });
        });

        // --- Action Dropdown Logic ---
        function toggleActionMenu(btn) {
            document.querySelectorAll('.action-dropdown.active').forEach(d => {
                if (d !== btn.parentElement) d.classList.remove('active');
            });
            const dropdown = btn.parentElement;
            dropdown.classList.toggle('active');
            if (dropdown.classList.contains('active')) {
                const content = dropdown.querySelector('.action-dropdown-content');
                content.style.display = 'block';
                const rect = btn.getBoundingClientRect();
                let top = rect.bottom;
                let left = rect.right - content.offsetWidth;
                if (top + content.offsetHeight > window.innerHeight) { top = rect.top - content.offsetHeight; }
                content.style.top = top + 'px';
                content.style.left = left + 'px';
                content.style.display = '';
            }
        }
        document.addEventListener('click', function (e) { if (!e.target.matches('.action-btn-main')) { document.querySelectorAll('.action-dropdown.active').forEach(d => d.classList.remove('active')); } });
        window.addEventListener('scroll', function () { document.querySelectorAll('.action-dropdown.active').forEach(d => d.classList.remove('active')); }, true);

        // --- Column Resizing Logic ---
        function enableColumnResizing() {
            const table = document.getElementById('customTable');
            const headers = table.querySelectorAll('th');
            headers.forEach((th) => {
                if (th.querySelector('.resizer')) return;
                const resizer = document.createElement('div');
                resizer.classList.add('resizer');
                th.appendChild(resizer);
                resizer.addEventListener('click', function (e) { e.stopPropagation(); });
                let startX, startWidth;
                resizer.addEventListener('mousedown', function (e) {
                    e.preventDefault(); e.stopPropagation();
                    startX = e.pageX; startWidth = th.offsetWidth;
                    resizer.classList.add('resizing');
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
                function onMouseMove(e) {
                    const newWidth = startWidth + (e.pageX - startX);
                    if (newWidth > 30) { th.style.width = newWidth + 'px'; th.style.minWidth = newWidth + 'px'; }
                }
                function onMouseUp() {
                    resizer.classList.remove('resizing');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    saveColumnWidths();
                }
            });
        }
        function saveColumnWidths() { const widths = []; document.querySelectorAll('#customTable th').forEach(th => { widths.push(th.style.width); }); localStorage.setItem('customDashColWidths_' + currentActivePageId, JSON.stringify(widths)); }
        function loadColumnWidths() { const savedWidths = JSON.parse(localStorage.getItem('customDashColWidths_' + currentActivePageId)); if (savedWidths && Array.isArray(savedWidths)) { document.querySelectorAll('#customTable th').forEach((th, index) => { if (savedWidths[index]) { th.style.width = savedWidths[index]; th.style.minWidth = savedWidths[index]; } }); } }
    </script>
