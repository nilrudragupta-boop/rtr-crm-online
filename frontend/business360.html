<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business 360° — Customer & Supplier Integrated Intelligence</title>
    <link rel="stylesheet" href="css/lightning-system.css">
    <style>
        .b360-header-card {
            background: #fff;
            border: 1px solid var(--slds-border);
            border-top: 4px solid var(--slds-brand);
            border-radius: var(--slds-radius-md);
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: var(--slds-shadow-card);
        }

        .b360-kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .b360-kpi-card {
            background: #fff;
            border: 1px solid var(--slds-border);
            border-radius: var(--slds-radius-md);
            padding: 12px 16px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .b360-kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border-color: var(--slds-brand);
        }

        .b360-tabs-header {
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
            width: 100%;
            min-width: 0;
            background: #fff;
            border: 1px solid var(--slds-border);
            border-bottom: none;
            border-radius: var(--slds-radius-md) var(--slds-radius-md) 0 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .b360-tab-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            font-size: 13px;
            font-weight: 600;
            color: var(--slds-text-muted);
            border: none;
            background: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .b360-tab-btn.active {
            color: var(--slds-brand);
            border-bottom-color: var(--slds-brand);
            background: var(--slds-surface-alt);
            box-shadow: inset 0 -3px 0 var(--slds-brand);
        }

        .b360-tab-content {
            background: #fff;
            border: 1px solid var(--slds-border);
            border-radius: 0 0 var(--slds-radius-md) var(--slds-radius-md);
            padding: 18px;
            min-height: 450px;
        }

        .b360-link {
            color: var(--slds-brand);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .b360-link:hover {
            text-decoration: underline;
        }

        .b360-alert-banner {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: var(--slds-radius-sm);
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
            gap: 8px;
        }

        .b360-alert-danger {
            background: #feebeb;
            color: #c51818;
            border: 1px solid #f8b4b4;
        }

        .b360-alert-warning {
            background: #fef8eb;
            color: #a15c03;
            border: 1px solid #f9dfad;
        }

        .b360-alert-info {
            background: #e8f4fc;
            color: #025da7;
            border: 1px solid #bce1fa;
        }

        .b360-pipeline-step {
            flex: 1;
            background: #f4f6f9;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            border-left: 3px solid var(--slds-brand);
            cursor: pointer;
        }

        .b360-pipeline-step:hover {
            background: #e8f0fe;
        }

        .b360-header-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .b360-party-title {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 22px;
            font-weight: 700;
        }

        .b360-party-meta {
            color: var(--slds-text-muted);
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.7;
        }

        .b360-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .b360-kpi-card {
            text-align: left;
            border: 1px solid var(--slds-border);
        }

        .b360-kpi-card span,
        .b360-kpi-card small {
            display: block;
        }

        .b360-kpi-card span {
            font-size: 10px;
            color: var(--slds-text-muted);
            letter-spacing: .04em;
            font-weight: 700;
        }

        .b360-kpi-card strong {
            display: block;
            font-size: 19px;
            margin: 5px 0;
            color: var(--slds-text);
        }

        .b360-kpi-card small {
            font-size: 10px;
            color: var(--slds-brand);
        }

        .b360-kpi-card.danger strong {
            color: var(--slds-danger);
        }

        .b360-kpi-card.warning strong {
            color: var(--slds-warning);
        }

        .b360-overview-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .b360-module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 9px;
        }

        .b360-module-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 11px 12px;
            background: var(--slds-surface-alt);
            border: 1px solid var(--slds-border);
            border-radius: 6px;
            cursor: pointer;
            color: var(--slds-brand);
            font-weight: 600;
            text-align: left;
        }

        .b360-module-link:hover {
            border-color: var(--slds-brand);
            background: #eef5ff;
        }

        .b360-link-btn {
            border: 0;
            background: none;
            padding: 0;
            color: var(--slds-brand);
            font-weight: 700;
            cursor: pointer;
        }

        .b360-link-btn:hover {
            text-decoration: underline;
        }

        .b360-table-wrap {
            overflow: auto;
        }

        .b360-empty,
        .b360-empty-small {
            padding: 28px;
            text-align: center;
            color: #7b8794;
        }

        .b360-empty-small {
            padding: 18px;
        }

        .b360-insights {
            margin: 0;
            padding-left: 18px;
            line-height: 1.9;
        }

        .b360-contact {
            padding: 7px 0;
            border-bottom: 1px solid var(--slds-border-subtle);
        }

        .b360-contact:last-child {
            border-bottom: 0;
        }

        .b360-contact span,
        .b360-contact small {
            display: block;
            color: #667085;
            font-size: 11px;
            margin-top: 2px;
        }

        .b360-fin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .b360-fin-card {
            border: 1px solid var(--slds-border);
            text-align: center;
            padding: 14px;
            cursor: pointer;
            background: #fff;
        }

        .b360-fin-card span,
        .b360-fin-card small {
            display: block;
            font-size: 10px;
            color: #667085;
        }

        .b360-fin-card strong {
            display: block;
            font-size: 19px;
            margin: 5px 0;
        }

        .b360-ageing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .b360-ageing-grid div {
            background: var(--slds-surface-alt);
            border: 1px solid var(--slds-border);
            border-radius: 6px;
            padding: 12px;
        }

        .b360-ageing-grid span,
        .b360-ageing-grid strong {
            display: block;
        }

        .b360-ageing-grid span {
            font-size: 10px;
            color: #667085;
        }

        .b360-timeline-item {
            border-left: 3px solid var(--slds-brand);
            padding: 0 0 12px 10px;
            margin-bottom: 12px;
        }

        .b360-document {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid var(--slds-border-subtle);
        }

        .b360-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .48);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .b360-score-modal {
            width: min(680px, 96vw);
            max-height: 88vh;
            overflow: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
            border: 1px solid var(--slds-border);
        }

        .b360-score-modal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--slds-border);
        }

        .b360-score-modal-head h2 {
            margin: 0;
            font-size: 20px;
        }

        .b360-score-modal-head p {
            margin: 5px 0 0;
            color: #667085;
            font-size: 12px;
        }

        .b360-modal-close {
            border: 0;
            background: var(--slds-surface-alt);
            border-radius: 6px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 16px;
        }

        .b360-score-explainer {
            margin: 16px 20px 8px;
            padding: 11px 12px;
            border: 1px solid var(--slds-border);
            border-radius: 7px;
            background: var(--slds-surface-alt);
            color: #475467;
            font-size: 12px;
            line-height: 1.6;
        }

        .b360-score-total {
            margin: 14px 20px;
            text-align: center;
            padding: 14px;
            border-radius: 9px;
            background: #f8fafc;
            border: 1px solid var(--slds-border);
        }

        .b360-score-total strong {
            font-size: 38px;
            line-height: 1;
        }

        .b360-score-total span {
            color: #667085;
            font-size: 16px;
        }

        .b360-score-total small {
            display: block;
            margin-top: 5px;
            font-weight: 700;
            color: var(--slds-brand);
        }

        .b360-score-components {
            padding: 0 20px 10px;
        }

        .b360-score-row {
            padding: 11px 0;
            border-bottom: 1px solid var(--slds-border-subtle);
        }

        .b360-score-row-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .b360-score-bar {
            height: 7px;
            background: #e7edf3;
            border-radius: 999px;
            overflow: hidden;
        }

        .b360-score-bar span {
            display: block;
            height: 100%;
            background: var(--slds-brand);
            border-radius: 999px;
        }

        .b360-score-row small {
            display: block;
            margin-top: 5px;
            color: #667085;
            font-size: 10px;
        }

        .b360-score-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            padding: 12px 20px 18px;
            font-size: 10px;
            color: #667085;
        }

        .b360-score-legend span {
            padding: 4px 7px;
            border: 1px solid var(--slds-border);
            border-radius: 999px;
        }

        @media(max-width:900px) {
            .b360-overview-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body {
                margin: 0;
                background: #fff !important;
                overflow: visible !important;
            }

            .slds-topbar,
            .slds-sidebar,
            .b360-selector-bar,
            .no-print {
                display: none !important;
            }

            .slds-workspace {
                overflow: visible !important;
            }

            .b360-tab-content {
                border: none !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="slds-shell">
        <!-- Lightning Topbar Header -->
        <header class="slds-topbar no-print">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="slds-btn" onclick="B360UI.backToDashboard()" title="Back to Workspace">←</button>
                <strong style="font-size: 16px; color: var(--slds-brand);">RISE Tech Revolution CRM</strong>
                <span class="slds-badge slds-badge-info">Business 360° Intelligence</span>
            </div>

            <!-- Party Selector Bar -->
            <div style="display: flex; align-items: center; gap: 8px; width: 550px;">
                <select id="partyTypeSelect" class="slds-btn" style="height:34px; font-weight:600;"
                    onchange="B360UI.onPartyTypeChange()">
                    <option value="customer">Customer 360°</option>
                    <option value="supplier">Supplier 360°</option>
                </select>
                <div class="slds-search-box" style="flex: 1;">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="partySearchInput"
                        placeholder="Search Customer / Supplier by Name, Code, GSTIN..." autocomplete="off">
                    <div id="partySearchResults" class="slds-search-results"></div>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <button class="slds-btn" onclick="window.print()">🖨️ Print 360°</button>
                <button class="slds-btn slds-btn-brand" onclick="B360UI.exportCSV()">📥 Export Data</button>
            </div>
        </header>

        <div class="slds-body-wrapper">
            <!-- Main Intelligence Workspace -->
            <main class="slds-workspace" style="padding: 16px 24px;">
                <!-- Breadcrumb Bar -->
                <div id="b360Breadcrumbs" style="font-size: 11px; color: var(--slds-text-muted); margin-bottom: 8px;"
                    class="no-print">
                    CRM Home &gt; Business 360° &gt; Customer &gt; <strong id="bcPartyName">Loading...</strong>
                </div>

                <!-- Party Header Card -->
                <div id="partyHeaderContainer"></div>

                <!-- Dynamic Clickable KPI Strip -->
                <div id="kpiStripContainer" class="b360-kpi-grid"></div>

                <!-- Intelligence Tabs Header -->
                <div class="b360-tabs-header no-print">
                    <button class="b360-tab-btn active" onclick="B360UI.switchTab('overview', this)">📊 Overview &amp;
                        Pipeline</button>
                    <button class="b360-tab-btn" onclick="B360UI.switchTab('transactions', this)">🧾 Transactions &amp;
                        Orders</button>
                    <button class="b360-tab-btn" onclick="B360UI.switchTab('financials', this)">💰 Financials &amp;
                        Ageing</button>
                    <button class="b360-tab-btn" id="tabPlantsBtn" onclick="B360UI.switchTab('plants', this)">🏭 Plants
                        &amp; Installed Spares</button>
                    <button class="b360-tab-btn" id="tabServiceBtn" onclick="B360UI.switchTab('service', this)">🛠️
                        Service &amp; Complaints</button>
                    <button class="b360-tab-btn" onclick="B360UI.switchTab('timeline', this)">🕒 Activity
                        Timeline</button>
                    <button class="b360-tab-btn" onclick="B360UI.switchTab('documents', this)">📁 Documents</button>
                </div>

                <!-- Tab Body Viewports -->
                <div class="b360-tab-content" id="b360TabViewport">
                    <!-- Dynamically Injected -->
                </div>
            </main>
        </div>
    </div>

    <!-- Detail Modal Dialog Container -->
    <div id="b360ModalContainer"></div>
    <div id="toastContainer" class="slds-toast-container"></div>

    <!-- Scripts -->
    <script src="apiClient.js"></script>
    <script src="business360_engine.js"></script>
    <script src="business360.js"></script>
<script src="crm_v2_integration.js"></script>
</body>

</html>
<style>
    .b360-record-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: underline;
        text-underline-offset: 2px;
        font-weight: 700;
        cursor: pointer;
        background: transparent;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--slds-brand, #0176d3)
    }

    .b360-record-link:hover {
        opacity: .82;
        text-decoration-thickness: 2px
    }
</style>
