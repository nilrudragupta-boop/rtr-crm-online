<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Ledger</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .table-responsive { max-height: 600px; }
        thead { position: sticky; top: 0; background-color: #fff; z-index: 1; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-history"></i> Item Stock Ledger</h4>
                <button type="button" class="btn btn-light btn-sm" onclick="window.history.back()">Back</button>
            </div>
            <div class="card-body">
                <div class="row mb-4 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">Select Item</label>
                        <input type="text" id="sl-item-search" class="form-control" list="sl-item-list" placeholder="Search Item..." autocomplete="off">
                        <datalist id="sl-item-list"></datalist>
                        <input type="hidden" id="sl-item">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date From</label>
                        <input type="date" id="sl-from-date" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date To</label>
                        <input type="date" id="sl-to-date" class="form-control">
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-primary w-100" onclick="generateLedger()">View</button>
                    </div>
                </div>

                <div class="row mb-3" id="itemDetailsRow" style="display:none; background:#e9ecef; padding:10px; border-radius:5px; margin-left: 0; margin-right: 0;">
                    <div class="col-md-3" style="font-size:13px;"><strong>Item Code:</strong> <span id="lbl-itemCode" class="text-primary">-</span></div>
                    <div class="col-md-3" style="font-size:13px;"><strong>Index No:</strong> <span id="lbl-indexNo" class="text-primary">-</span></div>
                    <div class="col-md-3" style="font-size:13px;"><strong>Category:</strong> <span id="lbl-category" class="text-primary">-</span></div>
                    <div class="col-md-3" style="font-size:13px;"><strong>UOM:</strong> <span id="lbl-uom" class="text-primary">-</span></div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="ledger-table">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Transaction Type</th>
                                <th>Reference / Remarks</th>
                                <th>Stock IN</th>
                                <th>Stock OUT</th>
                                <th>Running Balance</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="6" class="text-center text-muted">Select an item and click View to load ledger</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Integration Scripts -->
    <script src="apiClient.js"></script>
    <script src="stock_ledger.js"></script>
</body>
</html>
