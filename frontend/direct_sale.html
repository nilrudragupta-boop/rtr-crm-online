<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Sale & Billing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="settings.js"></script>
    <script src="brand.service.js"></script>
    <script src="brandLoader.js"></script>
    <script src="apiClient.js"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            body {
                background: #fff;
                font-size: 12px;
            }

            .card {
                border: none !important;
                box-shadow: none !important;
            }
        }

        .print-only {
            display: none;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-fluid py-4">
        <!-- Top Navigation / Header -->
        <div class="d-flex justify-content-between align-items-center mb-3 no-print embedded-hide">
            <div>
                <h3 class="mb-0 fw-bold"><i class="bi bi-receipt-cutoff text-primary me-2"></i>Direct Sale Invoice</h3>
                <small class="text-muted">Generate instant billing and record sales data</small>
            </div>
            <div class="d-flex gap-2">
                <a href="sales_report.html?embedded=1" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-people me-1"></i>Sales Report</a>
                <a href="item.html" class="btn btn-outline-secondary btn-sm"><i
                        class="bi bi-box-seam me-1"></i>Items</a>
                <button class="btn btn-primary btn-sm" onclick="saveAndPrintSale()"><i
                        class="bi bi-printer me-1"></i>Save & Print</button>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <!-- Invoice Meta & Customer Selection -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Invoice No</label>
                        <div class="input-group input-group-sm">
                            <input type="text" id="invoiceNo" class="form-control bg-light" readonly>
                            <button type="button" id="editInvoiceNoButton" class="btn btn-outline-secondary"
                                onclick="toggleInvoiceNoEditing()" title="Edit invoice number">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Invoice Date</label>
                        <input type="date" id="invoiceDate" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Select Customer</label>
                        <select id="customerSelect" class="form-select form-select-sm" onchange="onCustomerChange()">
                            <option value="">-- Choose Customer --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Payment Mode</label>
                        <select id="paymentMode" class="form-select form-select-sm">
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank / UPI</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Credit">Credit / Due</option>
                        </select>
                    </div>

                    <!-- Auto-filled Customer Summary -->
                    <div class="col-12" id="customerInfoBox" style="display:none;">
                        <div class="p-2 bg-light border rounded d-flex flex-wrap gap-4 text-muted small">
                            <div><strong>Phone:</strong> <span id="custPhone">-</span></div>
                            <div><strong>GSTIN:</strong> <span id="custGst">-</span></div>
                            <div><strong>Address:</strong> <span id="custAddress">-</span></div>
                        </div>
                    </div>
                </div>

                <!-- Item Table -->
                <div class="table-responsive mb-3">
                    <table class="table table-bordered align-middle" id="itemsTable">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 5%">#</th>
                                <th style="width: 24%">Item Name / Description</th>
                                <th style="width: 10%">UOM</th>
                                <th style="width: 12%">Qty</th>
                                <th style="width: 15%">Rate (₹)</th>
                                <th style="width: 12%">GST (%)</th>
                                <th style="width: 18%">Total Amount (₹)</th>
                                <th style="width: 8%" class="text-center no-print">Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceRows">
                            <!-- Dynamic Rows Injected Here -->
                        </tbody>
                    </table>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm no-print mb-4" onclick="addNewRow()">
                    <i class="bi bi-plus-circle me-1"></i>Add Item Row
                </button>

                <!-- Totals & Notes -->
                <div class="row g-3">
                    <div class="col-md-7">
                        <label class="form-label fw-semibold">Remarks / Note</label>
                        <textarea id="salesRemarks" class="form-control" rows="3"
                            placeholder="Additional details or terms..."></textarea>
                    </div>
                    <div class="col-md-5">
                        <div class="card bg-light border-0">
                            <div class="card-body p-3">
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Taxable Value:</span>
                                    <span class="fw-semibold" id="subTotal">₹0.00</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Total Tax (GST):</span>
                                    <span class="fw-semibold text-danger" id="taxTotal">₹0.00</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2 no-print">
                                    <label for="roundOffToggle" class="mb-0">Round Off</label>
                                    <input type="checkbox" id="roundOffToggle" onchange="toggleRoundOff()">
                                </div>
                                <div id="roundOffRow" class="d-flex justify-content-between mb-2" style="display:none;">
                                    <span>Round Off:</span>
                                    <span class="fw-semibold" id="roundOffAmount">₹0.00</span>
                                </div>
                                <hr class="my-2">
                                <div class="d-flex justify-content-between fs-5 fw-bold text-success">
                                    <span>Grand Total:</span>
                                    <span id="grandTotal">₹0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4 no-print">
                    <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
                    <button class="btn btn-success px-4" onclick="saveSaleRecord()">
                        <i class="bi bi-check-circle me-1"></i>Save Sale Record
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function normalizeCustomer(customer = {}) {
            const contact = customer.contact || customer.phone || '';
            const primaryContact = Array.isArray(contact) ? contact.join(', ') : String(contact || '');
            return {
                ...customer,
                id: customer.id || customer.customerId || '',
                name: customer.name || 'Walk-in Customer',
                phone: customer.phone || customer.contact || '',
                contact: primaryContact,
                gstin: customer.gstin || customer.gst || '',
                gst: customer.gst || customer.gstin || '',
                address: customer.address || customer.billingAddress || ''
            };
        }

        function normalizeItem(item = {}) {
            const gstRate = Number(item.gst ?? item.gstRate ?? item.gstPercentage ?? item.gst_percent ?? 0);
            return {
                ...item,
                id: item.id || item.itemId || '',
                name: item.name || item.itemName || 'Unnamed Item',
                uom: item.uom || 'Pcs',
                rate: Number(item.rate ?? item.salePrice ?? item.price ?? 0),
                salePrice: Number(item.salePrice ?? item.rate ?? item.price ?? 0),
                gstRate,
                gst: gstRate,
                description: item.description || '',
                itemCode: item.itemCode || item.code || ''
            };
        }

        // Initial fallback mock data if localStorage is empty
        function initializeStorage() {
            if (!localStorage.getItem('customers')) {
                localStorage.setItem('customers', JSON.stringify([
                    { id: 'CUST-101', name: 'Apex Traders', contact: '9876543210', gst: '19AAACA1234A1Z5', address: 'Kolkata, WB' },
                    { id: 'CUST-102', name: 'Sharma Enterprises', contact: '9123456780', gst: '19BBBCB5678B1Z2', address: 'Burdwan, WB' }
                ]));
            }
            if (!localStorage.getItem('items')) {
                localStorage.setItem('items', JSON.stringify([
                    { id: 'ITM-01', name: 'Industrial Valve 2-inch', uom: 'Pcs', salePrice: 1200, gst: 18 },
                    { id: 'ITM-02', name: 'Standard Fasteners Box', uom: 'Box', salePrice: 450, gst: 12 },
                    { id: 'ITM-03', name: 'Lubricant Oil 5L', uom: 'Ltr', salePrice: 850, gst: 18 }
                ]));
            }
        }

        let customers = [];
        let items = [];
        let isRoundOffEnabled = localStorage.getItem('directSaleRoundOff') === 'true';
        let isInvoiceNoEditing = false;

        async function loadSalesList() {
            try {
                if (typeof apiClient !== 'undefined' && apiClient.getSales) {
                    const remoteSales = await apiClient.getSales();
                    if (Array.isArray(remoteSales) && remoteSales.length) {
                        localStorage.setItem('sales_records', JSON.stringify(remoteSales));
                        return remoteSales;
                    }
                }
            } catch (error) {
                console.warn('Failed to sync remote sales:', error);
            }
            return JSON.parse(localStorage.getItem('sales_records') || '[]');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initializeStorage();
            customers = (JSON.parse(localStorage.getItem('customers') || '[]')).map(normalizeCustomer);
            items = (JSON.parse(localStorage.getItem('items') || '[]')).map(normalizeItem);
            document.getElementById('roundOffToggle').checked = isRoundOffEnabled;
            document.getElementById('roundOffRow').style.display = isRoundOffEnabled ? 'flex' : 'none';

            document.getElementById('invoiceDate').value = new Date().toISOString().split('T')[0];
            await loadSalesList();
            generateInvoiceNumber();
            populateCustomerDropdown();
            addNewRow();

            // If opened with ?editInvoice=INV-..., populate form for editing
            const params = new URLSearchParams(window.location.search);
            const editInvoice = params.get('editInvoice');
            if (editInvoice) {
                const sales = JSON.parse(localStorage.getItem('sales_records') || '[]');
                const sale = (sales || []).find(s => s.invoiceNo === editInvoice || s.id === editInvoice);
                if (sale) {
                    populateFormFromSale(sale);
                } else {
                    console.warn('Edit invoice not found:', editInvoice);
                    alert('Invoice not found for editing: ' + editInvoice);
                }
            }

            // If embedded inside SPA iframe, hide page chrome
            try {
                if (params.get('embedded')) {
                    document.querySelectorAll('.embedded-hide').forEach(el => el.style.display = 'none');
                    const container = document.querySelector('.container-fluid');
                    if (container) container.style.padding = '8px';
                }
            } catch (e) { }
        });

        function populateFormFromSale(sale) {
            if (!sale) return;
            document.getElementById('invoiceNo').value = sale.invoiceNo || sale.id || '';
            document.getElementById('invoiceDate').value = sale.invoiceDate || new Date().toISOString().split('T')[0];
            // try select customer by id, else by name
            if (sale.customerId) {
                document.getElementById('customerSelect').value = sale.customerId;
            } else if (sale.customerName) {
                const opt = Array.from(document.getElementById('customerSelect').options).find(o => o.textContent.includes(sale.customerName));
                if (opt) document.getElementById('customerSelect').value = opt.value;
            }
            onCustomerChange();
            document.getElementById('paymentMode').value = sale.paymentMode || 'Cash';
            document.getElementById('salesRemarks').value = sale.remarks || sale.note || '';

            // populate items
            document.getElementById('invoiceRows').innerHTML = '';
            (sale.items || []).forEach(itm => {
                addNewRow();
                const lastRow = document.querySelector('#invoiceRows tr:last-child');
                const sel = lastRow.querySelector('.item-select');
                if (itm.itemId) {
                    const option = Array.from(sel.options).find(o => o.value == itm.itemId);
                    if (option) sel.value = itm.itemId;
                } else if (itm.itemName) {
                    const option = Array.from(sel.options).find(o => o.textContent.trim() === itm.itemName.trim());
                    if (option) sel.value = option.value;
                }
                lastRow.querySelector('.item-uom').value = itm.uom || '';
                lastRow.querySelector('.item-qty').value = itm.qty || itm.quantity || 0;
                lastRow.querySelector('.item-rate').value = itm.rate || itm.salePrice || 0;
                lastRow.querySelector('.item-gst').value = itm.gstPercent || itm.gst || itm.gstRate || 0;
                calculateRow(lastRow.querySelector('.item-qty'));
            });
            calculateTotals();
            // mark editing id so save updates existing
            window.editingInvoiceNo = sale.invoiceNo || sale.id || null;
        }

        function generateInvoiceNumber() {
            const sales = JSON.parse(localStorage.getItem('sales_records') || '[]');
            const nextSeq = sales.length + 1;
            document.getElementById('invoiceNo').value = `INV-${new Date().getFullYear()}-${String(nextSeq).padStart(4, '0')}`;
            setInvoiceNoEditing(false);
        }

        function toggleInvoiceNoEditing() {
            setInvoiceNoEditing(!isInvoiceNoEditing);
        }

        function setInvoiceNoEditing(enabled) {
            isInvoiceNoEditing = enabled;
            const invoiceInput = document.getElementById('invoiceNo');
            const editButton = document.getElementById('editInvoiceNoButton');
            if (!invoiceInput || !editButton) return;

            invoiceInput.readOnly = !enabled;
            invoiceInput.classList.toggle('bg-light', !enabled);
            editButton.innerHTML = enabled ? '<i class="bi bi-check-lg"></i>' : '<i class="bi bi-pencil"></i>';
            editButton.title = enabled ? 'Use this invoice number' : 'Edit invoice number';

            if (enabled) {
                invoiceInput.focus();
                invoiceInput.select();
            }
        }

        function populateCustomerDropdown() {
            const select = document.getElementById('customerSelect');
            select.innerHTML = '<option value="">-- Choose Customer --</option>';
            customers.forEach(cust => {
                const opt = document.createElement('option');
                opt.value = cust.id;
                const phone = (cust.phone || cust.contact || '').split(',')[0].trim();
                opt.textContent = `${cust.name} (${phone || 'No Phone'})`;
                select.appendChild(opt);
            });
        }

        function onCustomerChange() {
            const custId = document.getElementById('customerSelect').value;
            const infoBox = document.getElementById('customerInfoBox');
            const cust = customers.find(c => c.id === custId);

            if (cust) {
                document.getElementById('custPhone').textContent = cust.phone || cust.contact || 'N/A';
                document.getElementById('custGst').textContent = cust.gstin || cust.gst || 'N/A';
                document.getElementById('custAddress').textContent = cust.address || 'N/A';
                infoBox.style.display = 'block';
            } else {
                infoBox.style.display = 'none';
            }
        }

        function addNewRow() {
            const tbody = document.getElementById('invoiceRows');
            const rowIndex = tbody.children.length + 1;

            let itemOptions = '<option value="">-- Select Item --</option>';
            items.forEach(itm => {
                const itemName = `${itm.name}${itm.itemCode ? ` (${itm.itemCode})` : ''}`;
                itemOptions += `<option value="${itm.id}" data-rate="${itm.rate}" data-gst="${itm.gstRate}" data-uom="${itm.uom || ''}" data-desc="${(itm.description || '').replace(/"/g, '&quot;')}">${itemName}</option>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
      <td class="row-num text-center">${rowIndex}</td>
      <td>
        <select class="form-select form-select-sm item-select" onchange="onItemSelect(this)">
          ${itemOptions}
        </select>
      </td>
      <td>
        <input type="text" class="form-control form-control-sm item-uom bg-light" value="" readonly>
      </td>
      <td>
        <input type="number" class="form-control form-control-sm item-qty" value="1" min="1" oninput="calculateRow(this)">
      </td>
      <td>
        <input type="number" class="form-control form-control-sm item-rate" value="0.00" step="0.01" oninput="calculateRow(this)">
      </td>
      <td>
        <input type="number" class="form-control form-control-sm item-gst" value="0" min="0" oninput="calculateRow(this)">
      </td>
      <td>
        <input type="text" class="form-control form-control-sm item-total bg-light" value="0.00" readonly>
      </td>
      <td class="text-center no-print">
        <button class="btn btn-outline-danger btn-sm" onclick="removeRow(this)"><i class="bi bi-trash"></i></button>
      </td>
    `;
            tbody.appendChild(tr);
            reindexRows();
        }

        function removeRow(btn) {
            const tbody = document.getElementById('invoiceRows');
            if (tbody.children.length > 1) {
                btn.closest('tr').remove();
                reindexRows();
                calculateTotals();
            } else {
                alert("At least one item row is required.");
            }
        }

        function reindexRows() {
            document.querySelectorAll('#invoiceRows tr').forEach((tr, idx) => {
                tr.querySelector('.row-num').textContent = idx + 1;
            });
        }

        function onItemSelect(selectElem) {
            const row = selectElem.closest('tr');
            const selected = selectElem.options[selectElem.selectedIndex];
            if (selected.value) {
                row.querySelector('.item-uom').value = selected.getAttribute('data-uom') || '';
                row.querySelector('.item-rate').value = selected.getAttribute('data-rate') || 0;
                row.querySelector('.item-gst').value = selected.getAttribute('data-gst') || 0;
            } else {
                row.querySelector('.item-uom').value = '';
                row.querySelector('.item-rate').value = '0.00';
                row.querySelector('.item-gst').value = '0';
            }
            calculateRow(selectElem);
        }

        function calculateRow(elem) {
            const row = elem.closest('tr');
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const gstPercent = parseFloat(row.querySelector('.item-gst').value) || 0;

            const baseAmount = qty * rate;
            const gstAmount = (baseAmount * gstPercent) / 100;
            const total = baseAmount + gstAmount;

            row.querySelector('.item-total').value = total.toFixed(2);
            calculateTotals();
        }

        function calculateTotals() {
            let subTotal = 0;
            let taxTotal = 0;

            document.querySelectorAll('#invoiceRows tr').forEach(row => {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const gstPercent = parseFloat(row.querySelector('.item-gst').value) || 0;

                const base = qty * rate;
                const tax = (base * gstPercent) / 100;

                subTotal += base;
                taxTotal += tax;
            });

            const baseTotal = subTotal + taxTotal;
            const roundOff = isRoundOffEnabled ? Math.round(baseTotal) - baseTotal : 0;
            const grandTotal = baseTotal + roundOff;

            document.getElementById('subTotal').textContent = `₹${subTotal.toFixed(2)}`;
            document.getElementById('taxTotal').textContent = `₹${taxTotal.toFixed(2)}`;
            document.getElementById('roundOffAmount').textContent = `${roundOff >= 0 ? '+' : '-'}₹${Math.abs(roundOff).toFixed(2)}`;
            document.getElementById('grandTotal').textContent = `₹${grandTotal.toFixed(2)}`;
        }

        function toggleRoundOff() {
            isRoundOffEnabled = document.getElementById('roundOffToggle').checked;
            localStorage.setItem('directSaleRoundOff', isRoundOffEnabled);
            document.getElementById('roundOffRow').style.display = isRoundOffEnabled ? 'flex' : 'none';
            calculateTotals();
        }

        function buildSalePayload() {
            const custId = document.getElementById('customerSelect').value;
            const cust = customers.find(c => c.id === custId);
            if (!cust) {
                alert("Please choose a customer first.");
                return null;
            }

            const lineItems = [];
            const rows = document.querySelectorAll('#invoiceRows tr');
            for (let row of rows) {
                const itemSelect = row.querySelector('.item-select');
                const itemId = itemSelect.value;
                if (!itemId) {
                    alert("Please make sure all rows have an item selected.");
                    return null;
                }
                const selectedItem = items.find(item => String(item.id) === String(itemId)) || {};
                lineItems.push({
                    itemId: itemId,
                    itemName: itemSelect.options[itemSelect.selectedIndex].text,
                    itemCode: selectedItem.itemCode || '',
                    description: selectedItem.description || '',
                    uom: row.querySelector('.item-uom').value || selectedItem.uom || '',
                    qty: parseFloat(row.querySelector('.item-qty').value) || 0,
                    rate: parseFloat(row.querySelector('.item-rate').value) || 0,
                    gstPercent: parseFloat(row.querySelector('.item-gst').value) || 0,
                    total: parseFloat(row.querySelector('.item-total').value) || 0
                });
            }

            return {
                invoiceNo: document.getElementById('invoiceNo').value,
                invoiceDate: document.getElementById('invoiceDate').value,
                customerId: cust.id,
                customerName: cust.name,
                customerPhone: cust.phone || cust.contact || '',
                customerGST: cust.gstin || cust.gst || '',
                paymentMode: document.getElementById('paymentMode').value,
                remarks: document.getElementById('salesRemarks').value,
                items: lineItems,
                subTotal: parseFloat(document.getElementById('subTotal').textContent.replace('₹', '')),
                taxTotal: parseFloat(document.getElementById('taxTotal').textContent.replace('₹', '')),
                roundOff: isRoundOffEnabled ? parseFloat(document.getElementById('roundOffAmount').textContent.replace(/[+₹]/g, '')) : 0,
                grandTotal: parseFloat(document.getElementById('grandTotal').textContent.replace('₹', '')),
                createdAt: new Date().toISOString()
            };
        }

        async function saveSaleRecord() {
            const payload = buildSalePayload();
            if (!payload) return false;

            const existingSales = JSON.parse(localStorage.getItem('sales_records') || '[]');
            const saleRecord = { ...payload, id: payload.id || `${Date.now()}` };
            if (window.editingInvoiceNo) {
                const idx = existingSales.findIndex(s => s.invoiceNo === window.editingInvoiceNo || s.id === window.editingInvoiceNo);
                if (idx !== -1) {
                    existingSales[idx] = saleRecord;
                } else {
                    existingSales.push(saleRecord);
                }
                // clear edit flag
                window.editingInvoiceNo = null;
            } else {
                existingSales.push(saleRecord);
            }
            localStorage.setItem('sales_records', JSON.stringify(existingSales));

            try {
                if (typeof apiClient !== 'undefined' && apiClient.saveSale) {
                    const result = await apiClient.saveSale(saleRecord);
                    if (result && result.success === false) {
                        console.warn('Backend sale sync failed:', result.message);
                    }
                }
            } catch (error) {
                console.warn('Error syncing sale to backend:', error);
            }

            alert(`Sale ${payload.invoiceNo} saved successfully!`);
            resetForm();
            return true;
        }

        function saveAndPrintSale() {
            if (saveSaleRecord()) {
                window.print();
            }
        }

        function resetForm() {
            document.getElementById('customerSelect').value = '';
            onCustomerChange();
            document.getElementById('salesRemarks').value = '';
            document.getElementById('roundOffToggle').checked = isRoundOffEnabled;
            document.getElementById('roundOffRow').style.display = isRoundOffEnabled ? 'flex' : 'none';
            document.getElementById('invoiceRows').innerHTML = '';
            generateInvoiceNumber();
            addNewRow();
            calculateTotals();
        }
    </script>
</body>

</html>
